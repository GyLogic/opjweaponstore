    /* =========================================================================
       EDIT TRANSACTION MODAL LOGIC (ADMIN ONLY)
       ========================================================================= */
    window.openEditLogModal = function(invoiceId) {
      if (!state.isAdmin) {
        showFeedback("Akses ditolak! Anda harus login sebagai admin untuk mengedit log.", false);
        return;
      }

      const tx = state.transactions.find(t => t.id === invoiceId);
      if (!tx) return;

      state.editingInvoice = JSON.parse(JSON.stringify(tx));

      document.getElementById("editLogIdLabel").textContent = `ID Faktur: ${state.editingInvoice.id}`;
      document.getElementById("editLogType").value = state.editingInvoice.type;
      document.getElementById("editLogDateTime").value = isoToDatetimeLocalInput(state.editingInvoice.timestamp);
      document.getElementById("editLogCustomer").value = state.editingInvoice.customer || "";
      document.getElementById("editLogStatus").value = state.editingInvoice.status || "COMPLETED";

      renderEditLogItemsTable();
      document.getElementById("editLogModal").classList.remove("hidden");
    };

    function renderEditLogItemsTable() {
      const tbody = document.getElementById("editLogItemsBody");
      tbody.innerHTML = "";

      let runningGrandTotal = 0;

      if (!state.editingInvoice.items || state.editingInvoice.items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-slate-500 text-xs">Semua barang telah dihapus dari transaksi ini.</td></tr>`;
        document.getElementById("editLogGrandTotal").textContent = "$0.00";
        return;
      }

      state.editingInvoice.items.forEach((line, idx) => {
        const subtotal = (line.qty || 0) * (line.unitPrice || 0);
        runningGrandTotal += subtotal;

        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-900/50 border-b border-emerald-950/60";
        tr.innerHTML = `
          <td class="py-2 px-2.5">
            <span class="font-medium text-slate-200 text-xs">${escapeHtml(line.itemName)}</span>
            <div class="text-[10px] text-slate-500 font-mono">${line.category}</div>
          </td>
          <td class="py-2 px-2 text-right">
            <input type="number" min="0" step="100" value="${line.unitPrice}" onchange="updateEditLinePrice(${idx}, this.value)" class="w-24 bg-[#18231c] border border-emerald-900/80 rounded px-1.5 py-1 text-right font-mono text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
          </td>
          <td class="py-2 px-2 text-center">
            <input type="number" min="1" value="${line.qty}" onchange="updateEditLineQty(${idx}, this.value)" class="w-16 bg-[#18231c] border border-emerald-900/80 rounded px-1.5 py-1 text-center font-mono text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
          </td>
          <td class="py-2 px-2 text-right font-mono font-semibold text-emerald-400 text-xs">
            ${formatUSD(subtotal)}
          </td>
          <td class="py-2 px-2 text-center">
            <button type="button" onclick="removeEditLine(${idx})" class="p-1 text-slate-500 hover:text-rose-400 transition" title="Hapus Item">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("editLogGrandTotal").textContent = formatUSD(runningGrandTotal);
    }

    window.updateEditLinePrice = function(index, value) {
      const val = parseFloat(value);
      if (!isNaN(val) && val >= 0) {
        state.editingInvoice.items[index].unitPrice = val;
        state.editingInvoice.items[index].subtotal = state.editingInvoice.items[index].qty * val;
        renderEditLogItemsTable();
      }
    };

    window.updateEditLineQty = function(index, value) {
      const val = parseInt(value, 10);
      if (!isNaN(val) && val >= 1) {
        state.editingInvoice.items[index].qty = val;
        state.editingInvoice.items[index].subtotal = val * state.editingInvoice.items[index].unitPrice;
        renderEditLogItemsTable();
      }
    };

    window.removeEditLine = function(index) {
      state.editingInvoice.items.splice(index, 1);
      renderEditLogItemsTable();
    };

    function saveEditedInvoice() {
      if (!state.editingInvoice) return;

      if (!state.editingInvoice.items || state.editingInvoice.items.length === 0) {
        showFeedback("Faktur harus memiliki minimal 1 item! Atau gunakan tombol hapus mutasi.", false);
        return;
      }

      const dt = document.getElementById("editLogDateTime").value;
      const type = document.getElementById("editLogType").value;
      const cust = document.getElementById("editLogCustomer").value.trim();
      const status = document.getElementById("editLogStatus").value;

      state.editingInvoice.type = type;
      state.editingInvoice.status = status;
      state.editingInvoice.customer = cust || (type === "OUT" ? "Customer Umum" : "Restock Gudang");
      if (dt) state.editingInvoice.timestamp = new Date(dt).toISOString();

      let totalUnits = 0;
      let grandTotal = 0;
      state.editingInvoice.items.forEach(i => {
        totalUnits += i.qty;
        grandTotal += (i.qty * i.unitPrice);
      });

      state.editingInvoice.totalUnits = totalUnits;
      state.editingInvoice.grandTotal = grandTotal;

      const idx = state.transactions.findIndex(t => t.id === state.editingInvoice.id);
      if (idx !== -1) {
        state.transactions[idx] = JSON.parse(JSON.stringify(state.editingInvoice));
        saveToCloud();
        renderAllViews();
        document.getElementById("editLogModal").classList.add("hidden");
        state.editingInvoice = null;
        showFeedback("Log transaksi berhasil disimpan & sisa stok dihitung ulang!");
      }
    }


    /* =========================================================================
       KAS PENJUALAN: PENDAPATAN -> PENYERAHAN UANG KE ORANG LAIN
       ========================================================================= */
    function getCashSummary() {
      let revenue = 0;
      state.transactions.forEach(tx => {
        const isDelivered = (tx.status === "COMPLETED") || (!tx.status);
        if (tx.type === "OUT" && isDelivered) revenue += (tx.grandTotal || 0);
      });
      const handed = state.handovers.reduce((sum, h) => sum + (Number(h.amount) || 0), 0);
      return { revenue, handed, balance: revenue - handed };
    }

    function renderCashPanel() {
      const { revenue, handed, balance } = getCashSummary();

      const bigBal = document.getElementById("cardCashBalanceBig");
      if (bigBal) {
        bigBal.textContent = formatUSD(balance);
        bigBal.className = "text-2xl font-bold font-mono mt-1 " + (balance < 0 ? "text-rose-400" : "text-amber-400");
      }

      document.getElementById("cashTotalRevenue").textContent = formatUSD(revenue);
      document.getElementById("cashTotalHandover").textContent = formatUSD(handed);
      document.getElementById("cashHandoverCount").textContent = `${state.handovers.length} kali penyerahan`;
      const balEl = document.getElementById("cashBalance");
      balEl.textContent = formatUSD(balance);
      balEl.className = "text-lg font-bold font-mono mt-1 " + (balance < 0 ? "text-rose-400" : "text-emerald-400");

      // Form khusus admin
      document.getElementById("cashFormWrapper").classList.toggle("hidden", !state.isAdmin);
      document.getElementById("cashViewOnlyNote").classList.toggle("hidden", state.isAdmin);
      document.querySelectorAll(".cash-admin-col").forEach(el => el.classList.toggle("hidden", !state.isAdmin));

      // Rekap per penerima
      const byRecipient = {};
      state.handovers.forEach(h => {
        const key = (h.recipient || "-").trim() || "-";
        byRecipient[key] = (byRecipient[key] || 0) + (Number(h.amount) || 0);
      });
      const recipients = Object.entries(byRecipient).sort((a, b) => b[1] - a[1]);
      const sumWrap = document.getElementById("cashRecipientSummaryWrap");
      const sumBox = document.getElementById("cashRecipientSummary");
      sumWrap.classList.toggle("hidden", recipients.length === 0);
      sumBox.innerHTML = recipients.map(([name, total]) => `
        <span class="px-2.5 py-1 rounded-lg bg-black/40 border border-emerald-900/50 text-[11px] text-slate-300">
          ${escapeHtml(name)}: <span class="font-mono font-bold text-amber-400">${formatUSD(total)}</span>
        </span>`).join("");

      // Riwayat (terbaru di atas)
      const tbody = document.getElementById("cashHistoryBody");
      const sorted = [...state.handovers].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      document.getElementById("cashHistoryEmpty").classList.toggle("hidden", sorted.length > 0);
      tbody.innerHTML = sorted.map(h => `
        <tr class="hover:bg-emerald-950/20">
          <td class="px-3 py-2 font-mono text-slate-300 whitespace-nowrap">${formatDateTimeLocal(h.timestamp)}</td>
          <td class="px-3 py-2 font-semibold text-slate-100">${escapeHtml(h.recipient)}</td>
          <td class="px-3 py-2 text-right font-mono font-bold text-rose-400 whitespace-nowrap">-${formatUSD(h.amount)}</td>
          <td class="px-3 py-2 text-slate-400">${escapeHtml(h.note) || '<span class="text-slate-600">-</span>'}</td>
          ${state.isAdmin ? `<td class="px-3 py-2 text-right"><button type="button" class="text-[10px] px-2 py-1 rounded bg-slate-800 hover:bg-rose-950/60 text-slate-400 hover:text-rose-400 border border-slate-700 hover:border-rose-900 transition" onclick="deleteHandover('${escapeHtml(h.id)}')">Hapus</button></td>` : ""}
        </tr>`).join("");
    }

    function openCashModal() {
      renderCashPanel();
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById("cashDateTime").value = now.toISOString().slice(0, 16);
      document.getElementById("cashFormError").classList.add("hidden");
      document.getElementById("cashModal").classList.remove("hidden");
    }

    function closeCashModal() {
      document.getElementById("cashModal").classList.add("hidden");
    }

    function showCashError(msg) {
      const el = document.getElementById("cashFormError");
      el.textContent = msg;
      el.classList.remove("hidden");
    }

    function submitHandover() {
      if (!state.isAdmin) {
        showCashError("Akses ditolak! Hanya admin yang bisa mengisi form penyerahan uang.");
        return;
      }
      const dtVal = document.getElementById("cashDateTime").value;
      const recipient = document.getElementById("cashRecipient").value.trim();
      const amount = Math.round(parseFloat(document.getElementById("cashAmount").value) * 100) / 100;
      const note = document.getElementById("cashNote").value.trim();
      const { balance } = getCashSummary();

      if (!dtVal) return showCashError("Tanggal & waktu wajib diisi.");
      if (!recipient) return showCashError("Nama penerima wajib diisi.");
      if (!amount || amount <= 0) return showCashError("Nominal harus lebih dari 0.");
      if (amount > balance + 0.0001) {
        return showCashError(`Nominal melebihi sisa saldo kas (${formatUSD(balance)}).`);
      }

      state.handovers.push({
        id: "KAS-" + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 5).toUpperCase(),
        timestamp: new Date(dtVal).toISOString(),
        recipient,
        amount,
        note
      });
      saveToCloud();

      document.getElementById("cashRecipient").value = "";
      document.getElementById("cashAmount").value = "";
      document.getElementById("cashNote").value = "";
      document.getElementById("cashFormError").classList.add("hidden");
      renderCashPanel();
      showFeedback(`Uang ${formatUSD(amount)} berhasil dicatat diserahkan ke ${recipient}.`, true);
    }

    window.deleteHandover = function(id) {
      if (!state.isAdmin) {
        showFeedback("Akses ditolak! Hanya admin yang bisa menghapus catatan penyerahan.", false);

      openModalDialog("Hapus Catatan Penyerahan?", "Catatan ini akan dihapus permanen dan nominalnya akan kembali menambah saldo kas penjualan.", () => {
        state.handovers = state.handovers.filter(h => h.id !== id);
        saveToCloud();
        renderCashPanel();
        showFeedback("Catatan penyerahan uang dihapus.");
      });
    };

    function showFeedback(msg, isSuccess = true) {

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function setCurrentDatetimeInput() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById("txDateTime").value = now.toISOString().slice(0, 16);
    }

    /* =========================================================================
       FIREBASE FIRESTORE: SINKRONISASI REALTIME
       Koleksi: items, transactions, handovers (1 dokumen per data)
       ========================================================================= */
    const COLS = ["items", "transactions", "handovers"];
    const cloud = {
      started: false,
      loaded: { items: false, transactions: false, handovers: false },
      cache: { items: new Map(), transactions: new Map(), handovers: new Map() }, // id -> JSON stabil terakhir dari server
      fromCache: false
    };

    function stableStringify(v) {
      if (Array.isArray(v)) return "[" + v.map(stableStringify).join(",") + "]";
      if (v && typeof v === "object") {
        return "{" + Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + stableStringify(v[k])).join(",") + "}";
      }
      return JSON.stringify(v);
    }

    function cleanDoc(o) {
      return JSON.parse(JSON.stringify(o)); // buang nilai undefined (tidak diterima Firestore)
    }

    function sanitizeDocId(o, prefix) {
      const copy = { ...o };
      let id = String(copy.id || "").replace(/[\/\s]/g, "_").slice(0, 120);
      if (!id) id = prefix + "-" + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase();
      copy.id = id;
      return copy;
    }

    function normalizeDoc(col, o) {
      if (col === "transactions" && !o.status) o.status = "COMPLETED"; // data lama tanpa status dianggap selesai
      return o;
    }

    function setSyncBadge(mode, text) {
      const el = document.getElementById("syncBadge");
      if (!el) return;
      const styles = {
        online:     ["bg-emerald-950/60 text-emerald-300 border-emerald-800", "bg-emerald-400"],
        connecting: ["bg-slate-800 text-slate-300 border-slate-700", "bg-amber-400 animate-pulse"],
        offline:    ["bg-amber-950/60 text-amber-300 border-amber-800", "bg-amber-400"],
        error:      ["bg-rose-950/60 text-rose-300 border-rose-800", "bg-rose-400"]
      };
      const [box, dot] = styles[mode] || styles.connecting;
      el.className = `text-[10px] border px-2 py-0.5 rounded font-semibold uppercase tracking-wider flex items-center gap-1 ${box}`;
      el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${dot}"></span><span>${text}</span>`;
    }

    function refreshSyncBadge() {
      if (!cloud.started) return;
      if (!navigator.onLine || cloud.fromCache) setSyncBadge("offline", "Offline - menunggu koneksi");
      else if (COLS.every(c => cloud.loaded[c])) setSyncBadge("online", "Tersinkron");
      else setSyncBadge("connecting", "Memuat data...");
    }

    function showCloudError(e) {
      const code = e && (e.code || e.message) ? (e.code || e.message) : String(e);
      let msg;
      if (code === "CONFIG_EMPTY") {
        msg = "Konfigurasi Firebase belum diisi. Buka file firebase-config.js lalu isi dengan config dari Firebase Console.";
      } else if (location.protocol === "file:") {
        msg = "Aplikasi ini tidak bisa dibuka dengan klik ganda (file://). Buka lewat alamat Vercel (https) atau server lokal.";
      } else if (code === "permission-denied") {
        msg = "Akses database ditolak. Pastikan Firestore Rules sudah dipasang dan dipublish (lihat panduan).";
      } else {
        msg = "Gagal terhubung ke Firebase: " + code;
      }
      const box = document.getElementById("cloudErrorBanner");
      box.textContent = msg;
      box.classList.remove("hidden");
      setSyncBadge("error", "Tidak terhubung");
    }

    function orderItems(arr) {
      const rank = {};
      DEFAULT_MASTER_ITEMS.forEach((it, i) => { rank[it.id] = i; });
      return arr.sort((a, b) => {
        const ra = rank[a.id] ?? 9999, rb = rank[b.id] ?? 9999;
        return ra !== rb ? ra - rb : String(a.name).localeCompare(String(b.name));
      });
    }

    function onColSnapshot(col, snap) {
      const map = new Map();
      let arr = [];
      snap.forEach(d => {
        const o = normalizeDoc(col, { ...d.data(), id: d.id });
        map.set(o.id, stableStringify(o));
        arr.push(o);
      });
      if (col === "items" || col === "transactions") {
        applyAmmoFix(col, arr);
        // cache disamakan dengan data terkoreksi agar tidak dianggap perubahan oleh saveToCloud
        arr.forEach(o => map.set(o.id, stableStringify(o)));
      }
      if (col === "items") arr = orderItems(arr);

      cloud.cache[col] = map;
      cloud.loaded[col] = true;
      cloud.fromCache = snap.metadata.fromCache;
      state[col] = arr;

      refreshSyncBadge();
      renderAllViews();
      if (typeof validateCartStock === "function") validateCartStock();
      if (typeof updatePickerStatus === "function") updatePickerStatus();
    }

    function restoreStateFromCache() {
      COLS.forEach(col => {
        let arr = [];
        cloud.cache[col].forEach(str => arr.push(JSON.parse(str)));
        state[col] = col === "items" ? orderItems(arr) : arr;
      });
      renderAllViews();
    }

    function startCloud() {
      if (cloud.started) return;
      cloud.started = true;
      const FB = window.FB;

      FB.onAuthStateChanged(FB.auth, user => {
        const ok = !!user && user.email === FB.ADMIN_EMAIL;
        if (user && !ok) { FB.signOut(FB.auth); return; }
        state.isAdmin = ok;
        applyRolePermissions();
      });

      COLS.forEach(col => {
        FB.onSnapshot(
          FB.collection(FB.db, col),
          snap => onColSnapshot(col, snap),
          err => showCloudError(err)
        );
      });

      window.addEventListener("online", refreshSyncBadge);
      window.addEventListener("offline", refreshSyncBadge);
      setSyncBadge("connecting", "Memuat data...");
    }

    function initCloudWhenReady() {
      if (window.FB) return startCloud();
      if (window.FB_ERROR) return showCloudError(window.FB_ERROR);
      setSyncBadge("connecting", "Menghubungkan...");
      window.addEventListener("fb-ready", startCloud, { once: true });
      window.addEventListener("fb-error", () => showCloudError(window.FB_ERROR), { once: true });
    }

    /**
     * Dipanggil setiap kali data di `state` berubah (menggantikan localStorage).
     * Membandingkan state dengan data terakhir dari server, lalu hanya menulis dokumen yang berubah / baru / dihapus.
     * User biasa HANYA boleh membuat transaksi baru (sesuai Firestore Rules).
     */
    async function saveToCloud() {
      if (!cloud.started || !window.FB) {
        showFeedback("Belum terhubung ke database online. Perubahan tidak tersimpan.", false);
        restoreStateFromCache();
        return;
      }
      const FB = window.FB;
      let ops = [];

      COLS.forEach(col => {
        if (!cloud.loaded[col]) return;
        const cache = cloud.cache[col];
        const seen = new Set();
        state[col].forEach(o => {
          const clean = cleanDoc(o);
          if (!clean.id) clean.id = sanitizeDocId(clean, col).id;
          seen.add(clean.id);
          if (cache.get(clean.id) !== stableStringify(clean)) ops.push({ type: "set", col, id: clean.id, data: clean });
        });
        cache.forEach((_, id) => { if (!seen.has(id)) ops.push({ type: "delete", col, id }); });
      });

      let blocked = false;
      if (!state.isAdmin) {
        const allowed = ops.filter(op => op.type === "set" && op.col === "transactions" && !cloud.cache.transactions.has(op.id));
        blocked = allowed.length !== ops.length;
        ops = allowed;
      }

      // Perbarui cache secara optimis agar pemanggilan beruntun tidak menulis ganda
      ops.forEach(op => {
        if (op.type === "set") cloud.cache[op.col].set(op.id, stableStringify(op.data));
        else cloud.cache[op.col].delete(op.id);
      });

      // Perubahan yang tidak diizinkan untuk user biasa dibatalkan di layar
      if (blocked) restoreStateFromCache();
      if (!ops.length) return;

      try {
        for (let i = 0; i < ops.length; i += 400) {
          const batch = FB.writeBatch(FB.db);
          ops.slice(i, i + 400).forEach(op => {
            const ref = FB.doc(FB.db, op.col, op.id);
            if (op.type === "set") batch.set(ref, op.data);
            else batch.delete(ref);
          });
          await batch.commit();
        }
      } catch (e) {
        const denied = e && e.code === "permission-denied";
        showFeedback(denied ? "Ditolak server: Anda tidak punya izin untuk perubahan ini (login admin dulu)." : "Gagal menyimpan ke database: " + (e.message || e), false);
      }
    }

    function updateDbBanner() {
      const banner = document.getElementById("dbEmptyBanner");
      if (!banner) return;
      const empty = cloud.loaded.items && state.items.length === 0;
      banner.classList.toggle("hidden", !empty);
      document.getElementById("btnSeedDefault").classList.toggle("hidden", !state.isAdmin);
    }

    /* =========================================================================
       IMPORT / EXPORT JSON BACKUP & CSV
       ========================================================================= */
    function exportBackupJson() {
      if (!state.isAdmin) { showFeedback("Akses ditolak! Export hanya untuk Admin.", false); return; }
      const payload = {
        app: "Tactical Armory POS (USD)",
        version: "3.0",
        currency: "USD",
        exportedAt: new Date().toISOString(),
        items: state.items,
        transactions: state.transactions,
        handovers: state.handovers
      };

      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Tactical_Armory_USD_Backup_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showFeedback("Backup data JSON berhasil diunduh!");
    }

    function handleFileImport(e) {
      if (!state.isAdmin) { showFeedback("Akses ditolak! Import hanya untuk Admin.", false); e.target.value = ""; return; }
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (!parsed || (!Array.isArray(parsed.items) && !Array.isArray(parsed.transactions))) {
            throw new Error("Format file JSON tidak cocok untuk Tactical Armory.");
          }

          openModalDialog(
            "Pulihkan Data dari JSON?",
            `File backup terdeteksi (${parsed.items?.length || 0} barang & ${parsed.transactions?.length || 0} faktur${Array.isArray(parsed.handovers) ? ' & ' + parsed.handovers.length + ' catatan serah kas' : ''}). Ini akan MENGGANTIKAN seluruh data online yang dilihat semua pengguna. Lanjutkan?`,
            () => {
              if (Array.isArray(parsed.items)) state.items = parsed.items;
              if (Array.isArray(parsed.transactions)) {
                // Semua transaksi lampau dari file backup diatur ke COMPLETED agar sisa stok akurat[cite: 2]
                state.transactions = parsed.transactions.map(t => ({
                  ...t,
                  status: t.status || "COMPLETED"
                }));
              }
              if (Array.isArray(parsed.handovers)) state.handovers = parsed.handovers;
              state.items = state.items.map(x => sanitizeDocId(x, "itm"));
              state.transactions = state.transactions.map(x => sanitizeDocId(x, "INV"));
              applyAmmoFix("items", state.items);
              applyAmmoFix("transactions", state.transactions);
              state.handovers = state.handovers.map(x => sanitizeDocId(x, "KAS"));
              state.cart = [];

              saveToCloud();
              renderAllViews();
              renderCart();
              updatePickerStatus();

            }
          );
        } catch (err) {
          showFeedback("Gagal membaca file: " + err.message, false);
        } finally {
          e.target.value = "";
        }
      };
      reader.readAsText(file);
    }

    function exportCsvReport() {
      if (!state.isAdmin) { showFeedback("Akses ditolak! Export hanya untuk Admin.", false); return; }
      const snapshot = calculateStockSnapshot();

      let csv = "Nama Barang,Kategori,Harga USD,Stok Awal,Total Masuk,Total Keluar,Sisa Stok,Total Valuasi USD\n";
      items.forEach(i => {
        const val = i.currentStock * i.price;
        csv += `"${i.name}","${i.category}",${i.price},${i.initialStock},${i.inQty},${i.outQty},${i.currentStock},${val}\n`;
      });

      csv += "\n\n--- RIWAYAT TRANSAKSI / FAKTUR ---\n";
      csv += "ID Faktur,Tanggal & Waktu,Tipe,Status Verifikasi,Customer / Sumber,Barang,Total Unit,Grand Total USD\n";
      state.transactions.forEach(t => {
        const itemSummaries = (t.items || []).map(i => `${i.qty}x ${i.itemName}`).join("; ");
        csv += `"${t.id}","${t.timestamp}","${t.type}","${t.status || 'COMPLETED'}","${t.customer}","${itemSummaries}",${t.totalUnits},${t.grandTotal}\n`;
      });

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Tactical_Armory_Report_USD_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    /* =========================================================================
       DOM INITIALIZATION
       ========================================================================= */
    document.addEventListener("DOMContentLoaded", () => {
      setCurrentDatetimeInput();
      setupCombobox();
      applyRolePermissions();
      renderCart();
      initCloudWhenReady();

      document.getElementById("btnSeedDefault").addEventListener("click", () => {
        if (!state.isAdmin) return;
        state.items = JSON.parse(JSON.stringify(DEFAULT_MASTER_ITEMS));
        saveToCloud();
        renderAllViews();
        showFeedback("Katalog awal berhasil dimuat ke database online.");
      });

      // Mode toggles
      document.getElementById("btnToggleOut").addEventListener("click", () => switchTransactionMode("OUT"));
      document.getElementById("btnToggleIn").addEventListener("click", () => switchTransactionMode("IN"));

      // Auth Triggers
      document.getElementById("btnAuthTrigger").addEventListener("click", openAdminLoginModal);
      document.getElementById("btnAuthTriggerMobile").addEventListener("click", openAdminLoginModal);
      document.getElementById("modalBtnCancelLogin").addEventListener("click", () => {
        document.getElementById("adminLoginModal").classList.add("hidden");
      });
      document.getElementById("modalBtnSubmitLogin").addEventListener("click", processAdminLogin);
      document.getElementById("adminPasswordInput").addEventListener("keypress", (e) => {
        if (e.key === "Enter") processAdminLogin();
      });

      // Kas penjualan
      const revCard = document.getElementById("cardRevenueClickable");
      revCard.addEventListener("click", openCashModal);
      revCard.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openCashModal(); }
      });
      document.getElementById("btnCloseCashModal").addEventListener("click", closeCashModal);
      document.getElementById("cashModal").addEventListener("click", (e) => {
        if (e.target.id === "cashModal") closeCashModal();
      });
      document.getElementById("btnSubmitCash").addEventListener("click", submitHandover);
      document.getElementById("btnCashAll").addEventListener("click", () => {
        const { balance } = getCashSummary();
        document.getElementById("cashAmount").value = balance > 0 ? balance.toFixed(2) : "";
      });

      // Cart buttons
      document.getElementById("btnAddItemToCart").addEventListener("click", addItemToCart);
      document.getElementById("btnAttachAdd").addEventListener("click", addSelectedAttachments);
      document.getElementById("btnAttachSkip").addEventListener("click", hideAttachmentSuggestion);
      document.getElementById("btnSubmitOrder").addEventListener("click", processOrderTransaction);

      // Sortable headers katalog
      document.querySelectorAll(".sortable-th").forEach(th => {
        th.addEventListener("click", () => handleSortClick(th.getAttribute("data-sort")));
      });

      // Search & category filters
      document.getElementById("searchTableInput").addEventListener("input", (e) => {
        state.filterSearch = e.target.value;
        const snapshot = calculateStockSnapshot();
        renderInventoryTable(Object.values(snapshot));
      });

      const pills = document.querySelectorAll(".cat-pill");
      pills.forEach(pill => {
        pill.addEventListener("click", () => {
          pills.forEach(p => {
            p.classList.remove("bg-emerald-600", "text-white");
            p.classList.add("bg-[#18231c]", "text-slate-400");
          });
          pill.classList.add("bg-emerald-600", "text-white");
          pill.classList.remove("bg-[#18231c]", "text-slate-400");

          state.filterCategory = pill.getAttribute("data-cat");
          const snapshot = calculateStockSnapshot();
          renderInventoryTable(Object.values(snapshot));
        });
      });

      // Edit Log Modal events
      document.getElementById("btnCloseEditModal").addEventListener("click", () => {
        document.getElementById("editLogModal").classList.add("hidden");
      });
      document.getElementById("btnCancelEditLog").addEventListener("click", () => {
        document.getElementById("editLogModal").classList.add("hidden");
      });
      document.getElementById("btnSaveEditLog").addEventListener("click", saveEditedInvoice);

      // Backup & Toolbars
      document.getElementById("btnExportJson").addEventListener("click", exportBackupJson);

      fileInput.addEventListener("change", handleFileImport);
      document.getElementById("btnExportCsv").addEventListener("click", exportCsvReport);
      document.getElementById("btnPrint").addEventListener("click", () => { if (state.isAdmin) window.print(); });

      // Reset data (Admin only)
      document.getElementById("btnResetData").addEventListener("click", () => {
        if (!state.isAdmin) return;
        openModalDialog(
          "Reset ke Data Awal?",
          "PERINGATAN: katalog dikembalikan ke bawaan, dan SEMUA transaksi serta catatan serah kas di database online akan dihapus untuk semua pengguna.",
          () => {
            state.items = JSON.parse(JSON.stringify(DEFAULT_MASTER_ITEMS));
            state.transactions = [];
            state.handovers = [];
            saveToCloud();
            state.cart = [];
            renderAllViews();

            showFeedback("Data berhasil direset ke nilai default.");

      // Clear all history (Admin only)
      document.getElementById("btnClearAllHistory").addEventListener("click", () => {
        if (!state.isAdmin || state.transactions.length === 0) return;
        openModalDialog(
          "Hapus Semua Riwayat?",

          () => {
            state.transactions = [];
            saveToCloud();
            renderAllViews();
            renderCart();
            showFeedback("Semua riwayat mutasi berhasil dibersihkan.");
          }
        );
      });
    });

  const row = (l, v, c) => '<div style="display:flex;justify-content:space-between;gap:8px"><span>' + l + '</span><b style="color:' + (c || '#e2e8f0') + '">' + v + '</b></div>';

  function display(base) {

    const p = BE.price(base, ev, wantVoucher());
    h += row('Subtotal harga katalog', fmt(base));

    else {

  }
  function apply(cart, base) {
    if (!isOut() || !pick || !ev) return null;
    const p = BE.price(base, ev, wantVoucher()), r2 = n => Math.round(n * 100) / 100;
    const items = cart.map(c => { const u = r2(c.unitPrice * p.factor); return Object.assign({}, c, { unitPrice: u, subtotal: r2(u * c.qty) }); });
    return { items, total: r2(items.reduce((s, i) => s + i.subtotal, 0)), memberId: String(pick.id),
      benefit: { basePrice: base, netPct: p.netPct, markupPct: wantVoucher() ? 0 : ev.markupPct, streak: ev.streak,

        gajiBatch: ev.gaji.batch || null, voucherUsed: p.voucherUsed, voucherKey: p.voucherUsed ? ev.voucher.key : null } };

      try { localStorage.setItem('opj_voucher_claims', JSON.stringify(c)); } catch (e) {} }
    useVoucher = false; ev = null; if (picker) picker.clear();
  }
  picker = OPJPicker.attach(input, { enabled: isOut, onPick: m => { pick = m; useVoucher = false; renderCart(); } });
  input.placeholder = 'Ketik nama anggota, misal: NAN...';
  window.OPJBenefit = { display, guard, apply, afterSubmit };
})();

<script type="text/plain" id="app-bh"><!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BARHAM SYNDICATE - Underground Cartel Ledger</title>
  <script>
/* BenefitEngine - fungsi murni (tanpa DOM). Dipakai browser (window.BenefitEngine) & tes Node. */
(function (root) {
  const DEFAULT_SETTINGS = {
    weekly: { ms: 100, sm: 2, cash: 30000 },
    eligibility: 'any',            // 'any' = setoran apa pun | 'ms' = wajib pernah setor Metal Scrap
    markupPct: 30,                 // kenaikan harga bila TIDAK rutin
    markupBelowStreak: 2,          // streak < nilai ini = tidak rutin
    streakTiers: [ {weeks:2,pct:3},{weeks:4,pct:5},{weeks:6,pct:10},{weeks:8,pct:15},{weeks:10,pct:20},{weeks:12,pct:25} ],
    voucher: { weeks: 16, amount: 200000 },
    gajiTiers: [ {min:200000,pct:10},{min:300000,pct:15},{min:450000,pct:20} ],
    gajiBatch: 'auto',             // 'auto' = batch selesai bernomor tertinggi, atau nama batch manual
    aliases: {}                    // { 'NAMA DI BARHAM': 'memberId' }
  };
  const num = v => Number(v) || 0;
  const weekOfDay = d => d <= 7 ? 1 : d <= 14 ? 2 : d <= 21 ? 3 : 4;
  const slotIndex = (y, m, w) => y * 48 + (m - 1) * 4 + (w - 1);
  const slotOfDate = dt => slotIndex(dt.getFullYear(), dt.getMonth() + 1, weekOfDay(dt.getDate()));
  function slotEnd(idx) {                     // akhir slot (ms epoch, waktu lokal)
    const y = Math.floor(idx / 48), r = idx % 48, m = Math.floor(r / 4) + 1, w = (r % 4) + 1;
    const lastDay = w === 4 ? new Date(y, m, 0).getDate() : w * 7;
    return new Date(y, m - 1, lastDay, 23, 59, 59, 999).getTime();
  }
  const fracOf = (o, wk) => num(o.ms) / wk.ms + num(o.sm) / wk.sm + num(o.cash) / wk.cash;

  /* Streak = jumlah minggu BERURUTAN yang lunas TEPAT WAKTU, dihitung mundur dari minggu sebelum minggu ini.
     Setoran yang baru diserahkan setelah minggu itu lewat (cicil susulan / borongan saat belanja) tidak dihitung. */
  function computeStreak(memberId, deposits, now, wk) {
    const cur = slotOfDate(now), paid = {};
    deposits.filter(d => String(d.memberId) === String(memberId)).forEach(d => {
      const t = new Date(d.dateTime); if (isNaN(t)) return;
      const m = parseInt(d.month, 10), w = parseInt(String(d.week).replace(/\D/g, ''), 10) || 1;
      const idx = slotIndex(t.getFullYear(), m, Math.min(4, w));
      if (idx >= cur) return;                         // hanya minggu-minggu sebelumnya
      if (t.getTime() > slotEnd(idx)) return;         // terlambat
      paid[idx] = (paid[idx] || 0) + fracOf(d, wk);
    });
    let s = 0;
    while (paid[cur - 1 - s] >= 1 - 1e-6) s++;
    return { streak: s, startSlot: cur - s };
  }

  function findBarhamName(member, aliases, name) {
    const n = String(name || '').trim().toLowerCase();
    if (!n) return false;
    for (const k in aliases) if (k.trim().toLowerCase() === n) return String(aliases[k]) === String(member.id);
    return n === String(member.nickname).trim().toLowerCase();
  }
  function pickBatch(barham, setting) {
    const b = (barham && barham.batches) || [];
    if (setting && setting !== 'auto') return String(setting);
    const done = b.filter(x => x.status === 'selesai').map(x => x.name).sort((a, c) => parseFloat(c) - parseFloat(a));

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cartelState));

        console.error('Storage error', e);
      }

    function formatMoney(num) {
      if (num === null || num === undefined || num === '') return '$0';
      return '$' + Number(num).toLocaleString('id-ID');
    }

    function formatNumber(num) {
      if (num === null || num === undefined || num === '') return '0';
      return Number(num).toLocaleString('id-ID');
    }

    function parseFormattedNumber(val) {
      if (!val) return 0;
      return Number(String(val).replace(/[^0-9]/g, '')) || 0;
    }

    function formatLiveThousand(input) {
      const clean = input.value.replace(/[^0-9]/g, '');
      if (!clean) {
        input.value = '';
        return;
      }
      input.value = Number(clean).toLocaleString('id-ID');
    }

      umer: { title: 'Total Setoran Umer', color: 'text-red-400' },
      paid: { title: 'Gaji Cair (PAID)', color: 'text-emerald-400' },
      pending: { title: 'Gaji Belum Bayar', color: 'text-amber-400' },
      denda: { title: 'Total Denda Hilang', color: 'text-rose-400' },
      workers: { title: 'Pekerja Beroperasi', color: 'text-cyan-400' }
    };
    let kpiState = { metric: 'umer', mode: 'ALL', batch: '', combo: [] };

    // batchSet: null = semua batch, atau Set nama batch (string)
    function computeKPI(batchSet) {
      const r = { umer: 0, paid: 0, pending: 0, denda: 0, workers: new Set(), entries: [] };
      const add = (row, nama, gaji, kat) => {
        if (batchSet && !batchSet.has(String(row.batch))) return;
        const um = Number(row.setoranUmer) || 0;
        const dn = Number(row.denda) || 0;
        r.umer += um;
        r.denda += dn;
        if (row.status === 'PAID') r.paid += gaji;
        else if (row.status === 'PENDING') r.pending += gaji;
        const nm = (nama || '').toUpperCase();
        if (nm) r.workers.add(nm);
        r.entries.push({ nama: nm, batch: String(row.batch), kat, umer: um, denda: dn, gaji, status: row.status });
      };
      cartelState.jualan.forEach(j => add(j, j.sales, Number(j.totalGaji) || 0, 'JUALAN'));
      cartelState.packing.forEach(p => add(p, p.nama, Number(p.gaji) || 0, 'PACKING'));
      cartelState.weed.forEach(w => add(w, w.petani, Number(w.gaji) || 0, 'WEED'));
      return r;
    }

    function kpiEntryValue(metric, e) {
      if (metric === 'umer') return e.umer;
      if (metric === 'paid') return e.status === 'PAID' ? e.gaji : 0;
      if (metric === 'pending') return e.status === 'PENDING' ? e.gaji : 0;
      if (metric === 'denda') return e.denda;
      return e.gaji;

      entries.forEach(e => {
        const v = kpiEntryValue(metric, e);
        if (metric !== 'workers' && v <= 0) return;
        const p = people[e.nama] || (people[e.nama] = { nama: e.nama, total: 0, count: 0, kats: new Set(), batches: {}, wait: 0 });
        p.total += v;
        p.count++;
        p.kats.add(e.kat);
        p.batches[e.batch] = (p.batches[e.batch] || 0) + v;
        if (metric === 'umer' && e.status === 'MENUNGGU') p.wait += v;
      });
      const list = Object.values(people).sort((a, b) => b.total - a.total);
      const grand = list.reduce((a, p) => a + p.total, 0);

      const head = `<div class="flex items-center justify-between pt-1">
        <span class="text-[11px] text-slate-400 uppercase font-rajdhani font-bold tracking-wider">${KPI_LIST_TITLE[metric]} (${list.length})</span>
      </div>`;
      if (!list.length) return head + `<p class="text-xs text-slate-500 py-2">Belum ada data pada cakupan batch ini.</p>`;

      const rows = list.map(p => `
        <div class="p-2.5 rounded-xl bg-[#141a24] border border-[#242f43] space-y-1.5">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="font-bold text-white uppercase">${p.nama}</span>
              ${[...p.kats].map(k => `<span class="badge-${k.toLowerCase()} px-1.5 rounded text-[9px] font-bold">${k}</span>`).join('')}
              <span class="text-[10px] text-slate-500">${p.count} laporan</span>
            </div>
            <span class="font-black ${meta.color}">${money(p.total)}</span>
          </div>
          <div class="flex flex-wrap gap-1.5">
            ${Object.keys(p.batches).sort().map(b => `<span class="px-2 py-0.5 rounded bg-[#0d121a] border border-[#273247] text-[10px] text-slate-300">B-${b}: <strong class="${meta.color}">${money(p.batches[b])}</strong></span>`).join('')}
          </div>
          ${p.wait > 0 ? `<div class="text-[10px] text-amber-400">⏳ ${formatMoney(p.wait)} masih menunggu konfirmasi Boss</div>` : ''}
        </div>`).join('');

      const foot = metric === 'workers' ? '' : `<div class="flex items-center justify-between p-2.5 rounded-xl border border-[#2d3a52] bg-[#0d121a]">
        <span class="text-slate-400 uppercase text-[10px] font-bold">Total daftar di atas</span>
        <span class="font-black ${meta.color}">${money(grand)}</span></div>`;
      return head + `<div class="space-y-1.5">${rows}</div>` + foot;
    }

    function kpiFmt(metric, r) {
      if (metric === 'workers') return `${r.workers.size} Org`;
      if (metric === 'denda') return '-' + formatMoney(r.denda);
      return formatMoney(r[metric]);
    }

      document.getElementById('kpiTotalDenda').innerText = kpiFmt('denda', r);
      document.getElementById('kpiTotalWorkers').innerText = kpiFmt('workers', r);

    function openKpiDetail(metric) {
      const names = cartelState.batches.map(b => String(b.name));
      kpiState = {
        metric,
        mode: 'ALL',
        batch: selectedDashboardBatch !== 'ALL' ? String(selectedDashboardBatch) : (names[0] || ''),
        combo: names.slice(0, 2)
      };

    function closeKpiDetail() { document.getElementById('modalKpiDetail').classList.add('hidden'); }
    function setKpiMode(mode) { kpiState.mode = mode; renderKpiDetail(); }
    function setKpiBatch(v) { kpiState.batch = v; renderKpiDetail(); }
    function toggleKpiCombo(name, on) {
      kpiState.combo = kpiState.combo.filter(n => n !== name);
      if (on) kpiState.combo.push(name);
      renderKpiDetail();
    }

    function renderKpiDetail() {
      const { metric, mode } = kpiState;
      const meta = KPI_META[metric];
      const names = cartelState.batches.map(b => String(b.name));
      document.getElementById('kpiDetailTitle').innerText = meta.title;

      const tabs = { ALL: '🌐 Semua Batch', SINGLE: '🎯 Satu Batch', COMBO: '➕ Gabungan Batch' };
      Object.keys(tabs).forEach(k => {
        const el = document.getElementById('kpiTab-' + k);
        el.innerText = tabs[k];
        el.className = 'px-2 py-2 rounded-xl border font-rajdhani font-bold text-xs md:text-sm tracking-wide transition ' +
          (mode === k ? 'border-amber-500 bg-amber-500/15 text-amber-400' : 'border-[#273247] bg-[#141a24] text-slate-400 hover:text-white');
      });

      let controls = '';
      let scopeSet = null, scopeLabel = 'Semua Batch', rows = names;

      if (mode === 'SINGLE') {
        controls = `<select onchange="setKpiBatch(this.value)" class="w-full bg-[#141a24] border border-[#273247] rounded-xl px-3 py-2 text-amber-400 font-bold text-xs focus:outline-none focus:border-amber-500">
          ${names.map(n => `<option value="${n}" ${n === kpiState.batch ? 'selected' : ''}>Batch ${n}</option>`).join('')}
        </select>`;
        scopeSet = new Set([kpiState.batch]);
        scopeLabel = `Batch ${kpiState.batch}`;
        rows = [kpiState.batch];
      } else if (mode === 'COMBO') {
        controls = `<div class="flex flex-wrap gap-2">${names.map(n => {
          const on = kpiState.combo.includes(n);
          return `<label class="cursor-pointer px-3 py-1.5 rounded-xl border text-xs font-bold ${on ? 'border-amber-500 bg-amber-500/15 text-amber-400' : 'border-[#273247] bg-[#141a24] text-slate-400'}">
            <input type="checkbox" class="hidden" ${on ? 'checked' : ''} onchange="toggleKpiCombo('${n}', this.checked)"> ${on ? '✓ ' : ''}Batch ${n}
          </label>`;
        }).join('')}</div>`;
        const sel = names.filter(n => kpiState.combo.includes(n));
        scopeSet = new Set(sel);
        scopeLabel = sel.length ? sel.map(n => `Batch ${n}`).join(' + ') : 'Belum ada batch dipilih';
        rows = sel;
      }
      document.getElementById('kpiModeControls').innerHTML = controls;

      const total = computeKPI(scopeSet);
      const breakdown = rows.map(n => {
        const b = cartelState.batches.find(x => String(x.name) === n);

        return `<div class="flex items-center justify-between p-2.5 rounded-xl bg-[#141a24] border border-[#242f43]">
          <div class="flex items-center gap-2">
            <span class="font-bold text-white">Batch ${n}</span>

          </div>
          <span class="font-black ${meta.color}">${kpiFmt(metric, r)}</span>
        </div>`;
      }).join('');

      document.getElementById('kpiDetailResult').innerHTML = `
        <div class="p-4 rounded-2xl bg-[#141a24] border border-[#2d3a52] text-center">
          <div class="text-[11px] text-slate-400 uppercase">${scopeLabel}</div>
          <div class="font-rajdhani font-black text-3xl ${meta.color} mt-1">${kpiFmt(metric, total)}</div>
        </div>

              <button onclick="deleteRowItem('weed', '${row.id}')" class="text-rose-400 hover:text-rose-300 text-[11px] font-bold">Hapus</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderSlipGajiTable() {
      const tbody = document.getElementById('tbodySlipGaji');
      if (!tbody) return;

      const q = (document.getElementById('filterSlipSearch')?.value || '').toLowerCase();
      const bFilter = document.getElementById('filterSlipBatchSelect')?.value || 'ALL';
      const isAll = bFilter === 'ALL';

      const workerMap = {};

      const ensureWorker = (name) => {
        const key = name.toUpperCase().trim();
        if (!workerMap[key]) {
          workerMap[key] = {
            nama: key,
            roles: new Set(),
            totalSetor: 0,
            totalDenda: 0,
            gajiPaid: 0,
            gajiPending: 0,
            totalGaji: 0
          };
        }
        return workerMap[key];
      };

      cartelState.jualan.forEach(j => {
        if (isAll || String(j.batch) === bFilter) {
          const w = ensureWorker(j.sales);
          w.roles.add('JUALAN');
          w.totalSetor += (Number(j.terjual) || 0);
          w.totalDenda += (Number(j.denda) || 0);
          if (j.status === 'PAID') w.gajiPaid += (Number(j.totalGaji) || 0);
          else if (j.status === 'PENDING') w.gajiPending += (Number(j.totalGaji) || 0); else if (j.status === 'MENUNGGU') w.menunggu = (w.menunggu || 0) + (Number(j.totalGaji) || 0);
          w.totalGaji += (Number(j.totalGaji) || 0);
        }
      });

      cartelState.packing.forEach(p => {
        if (isAll || String(p.batch) === bFilter) {
          const w = ensureWorker(p.nama);
          w.roles.add('PACKING');
          w.totalSetor += (Number(p.pack) || 0);
          w.totalDenda += (Number(p.denda) || 0);
          if (p.status === 'PAID') w.gajiPaid += (Number(p.gaji) || 0);
          else if (p.status === 'PENDING') w.gajiPending += (Number(p.gaji) || 0); else if (p.status === 'MENUNGGU') w.menunggu = (w.menunggu || 0) + (Number(p.gaji) || 0);
          w.totalGaji += (Number(p.gaji) || 0);
        }
      });

      cartelState.weed.forEach(w => {
        if (isAll || String(w.batch) === bFilter) {
          const wrk = ensureWorker(w.petani);
          wrk.roles.add('WEED');
          wrk.totalSetor += (Number(w.panen) || 0);
          wrk.totalDenda += (Number(w.denda) || 0);
          if (w.status === 'PAID') wrk.gajiPaid += (Number(w.gaji) || 0);
          else if (w.status === 'PENDING') wrk.gajiPending += (Number(w.gaji) || 0); else if (w.status === 'MENUNGGU') wrk.menunggu = (wrk.menunggu || 0) + (Number(w.gaji) || 0);
          wrk.totalGaji += (Number(w.gaji) || 0);
        }
      });

      const workerList = Object.values(workerMap).filter(w => w.nama.toLowerCase().includes(q));

      if (workerList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-slate-500">Tidak ada anggota yang bekerja pada batch terpilih.</td></tr>`;
        return;
      }

      tbody.innerHTML = workerList.map(w => {
        const hasPending = w.gajiPending > 0;
        const roleBadges = Array.from(w.roles).map(r => {
          if (r === 'JUALAN') return `<span class="badge-jualan px-1.5 py-0.2 rounded text-[9px] font-bold">JUAL</span>`;
          if (r === 'PACKING') return `<span class="badge-packing px-1.5 py-0.2 rounded text-[9px] font-bold">PACK</span>`;
          if (r === 'WEED') return `<span class="badge-weed px-1.5 py-0.2 rounded text-[9px] font-bold">WEED</span>`;
          return '';
        }).join(' ');

        return `
          <tr class="hover:bg-[#141a24]/80 transition">
            <td>
              <div class="font-bold text-white uppercase font-rajdhani text-xs">${w.nama}</div>${window.OPJRank?window.OPJRank(w.nama):""}
              <div class="text-[10px] text-amber-400/90 font-black">Tot: ${formatMoney(w.totalGaji)}</div>
            </td>
            <td>
              <div class="flex flex-wrap gap-1">${roleBadges}</div>
            </td>
            <td class="text-right">
              <div><strong>${formatNumber(w.totalSetor)}</strong> pcs</div>
              <div class="text-[10px] ${w.totalDenda > 0 ? 'text-rose-400 font-bold' : 'text-slate-500'}">-${formatMoney(w.totalDenda)}</div>
            </td>
            <td class="text-right font-bold text-emerald-400">
              ${formatMoney(w.gajiPaid)}
            </td>
            <td class="text-right">
              ${hasPending 
                ? `<span class="font-black text-amber-400">${formatMoney(w.gajiPending)}</span>`
                : (w.menunggu > 0 ? `<span class="text-cyan-400 text-[10px]">⏳ ${formatMoney(w.menunggu)} menunggu Boss</span>` : `<span class="text-slate-500 text-[10px]">Lunas</span>`)
              }
            </td>
            <td class="text-center">
              <button onclick="openModalRincianWorker('${w.nama}')" class="px-2.5 py-1 rounded-lg bg-[#161d2a] hover:bg-[#1f283a] border border-[#273247] text-amber-400 font-bold text-[10px] transition">
                🔍 Cek
              </button>
            </td>
            <td class="text-center action-admin-col ${cartelState.isAdmin ? '' : 'hidden'}">
              ${hasPending 
                ? `<button onclick="payoutAllForWorker('${w.nama}')" title="Cairkan semua gaji" class="px-2.5 py-1 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-black font-black text-[9px] uppercase shadow transition">
                    ✓ BAYAR
                  </button>`
                : `<span class="text-slate-500 text-[10px]">PAID</span>`
              }
            </td>
          </tr>
        `;
      }).join('');
    }

    function payoutAllForWorker(nama) {
      if (!cartelState.isAdmin) return;

      let changedCount = 0;
      cartelState.jualan.forEach(j => {
        if (j.sales.toUpperCase() === nama && j.status === 'PENDING') {
          j.status = 'PAID';
          changedCount++;
        }
      });
      cartelState.packing.forEach(p => {
        if (p.nama.toUpperCase() === nama && p.status === 'PENDING') {
          p.status = 'PAID';
          changedCount++;
        }
      });
      cartelState.weed.forEach(w => {
        if (w.petani.toUpperCase() === nama && w.status === 'PENDING') {
          w.status = 'PAID';
          changedCount++;
        }
      });

      saveCartelState();
      renderCurrentView();
      notify(`Seluruh gaji untuk ${nama} (${changedCount} transaksi) berhasil dicairkan (PAID)!`, '💰');
    }

    function toggleSingleStatus(type, id) {
      if (!cartelState.isAdmin) return;
      const target = cartelState[type].find(x => x.id === id);
      if (target && type !== 'mutasi' && target.status === 'MENUNGGU') {
        const mm = cartelState.mutasi.find(x => x.id === target.mutasiId);
        if (mm) toggleKonfirmasi(mm); else target.status = 'PENDING';
        saveCartelState(); renderCurrentView(); notify('Setoran dikonfirmasi Boss. Gaji masuk daftar belum dibayar.', '✓');
        return;
      }
      if (!target) return;

      if (type === 'mutasi') {
        if (!toggleKonfirmasi(target)) return;
        notify(target.status === 'APPROVED' ? 'Setoran dikonfirmasi Boss.' : 'Konfirmasi dibatalkan.', target.status === 'APPROVED' ? '✓' : '⏳');
      } else {
        const oldStatus = target.status;
        target.status = oldStatus === 'PAID' ? 'PENDING' : 'PAID';
        notify(`Status gaji diubah menjadi ${target.status}. Slip gaji otomatis tersinkronisasi!`, target.status === 'PAID' ? '💰' : '⏳');
      }

      saveCartelState();
      renderCurrentView();
    }

    function statusLabel(row) { return row.status === 'MENUNGGU' ? '⏳ MENUNGGU BOSS' : 'PENDING'; }

    function toggleKonfirmasi(m) {
      const rows = [...cartelState.jualan, ...cartelState.packing, ...cartelState.weed].filter(r => r.mutasiId === m.id);
      if (m.status === 'APPROVED') {
        if (rows.some(r => r.status === 'PAID')) { notify('Gaji sudah dicairkan, konfirmasi tidak bisa dibatalkan.', '⚠️'); return false; }
        m.status = 'PENDING';
        rows.forEach(r => { if (r.status === 'PENDING') r.status = 'MENUNGGU'; });
      } else {
        m.status = 'APPROVED';
        rows.forEach(r => { if (r.status === 'MENUNGGU') r.status = 'PENDING'; });
      }
      return true;
    }

    function ringkasSetor(m) {
      if (m.kategori === 'JUALAN') return `Hilang: ${m.hilang || 0} | Uang merah: ${formatMoney(m.setoranUmer)}`;
      if (m.kategori === 'PACKING') return `Hasil pack: ${formatNumber(m.jumlah)}` + (m.sekalianJual ? ` + Jual | Hilang: ${m.hilang || 0} | Uang merah: ${formatMoney(m.setoranUmer)}` : '');
      return `Hasil panen: ${formatNumber(m.jumlah)}`;
    }

    function openModalEditBatch(batchName) {
      if (!cartelState.isAdmin) return;
      const b = cartelState.batches.find(x => String(x.name) === String(batchName));
      if (!b) return;

      document.getElementById('edit_batch_original_name').value = b.name;
      document.getElementById('edit_batch_name').value = b.name;
      document.getElementById('edit_batch_tarifJualan').value = Number(b.tarifJualan || 60000).toLocaleString('id-ID');
      document.getElementById('edit_batch_tarifPacking').value = Number(b.tarifPacking || 50000).toLocaleString('id-ID');
      document.getElementById('edit_batch_tarifWeed').value = Number(b.tarifWeed || 40000).toLocaleString('id-ID');
      document.getElementById('edit_batch_tarifDenda').value = b.tarifDenda || 300;

      document.getElementById('modalEditBatch').classList.remove('hidden');
    }

    function closeModalEditBatch() {
      document.getElementById('modalEditBatch').classList.add('hidden');
    }

    function handleEditBatchSubmit(e) {
      e.preventDefault();
      if (!cartelState.isAdmin) return;

      const origName = document.getElementById('edit_batch_original_name').value;
      const newName = document.getElementById('edit_batch_name').value.trim();

      const b = cartelState.batches.find(x => String(x.name) === String(origName));
      if (!b) return;

      if (newName !== origName && cartelState.batches.some(x => String(x.name).toLowerCase() === newName.toLowerCase())) {
        notify('Nama batch tersebut sudah ada!', '⚠️');
        return;
      }

      b.name = newName;
      b.tarifJualan = parseFormattedNumber(document.getElementById('edit_batch_tarifJualan').value) || 60000;
      b.tarifPacking = parseFormattedNumber(document.getElementById('edit_batch_tarifPacking').value) || 50000;
      b.tarifWeed = parseFormattedNumber(document.getElementById('edit_batch_tarifWeed').value) || 40000;
      b.tarifDenda = Number(document.getElementById('edit_batch_tarifDenda').value) || 300;

      if (newName !== origName) {
        cartelState.jualan.forEach(j => { if (String(j.batch) === String(origName)) j.batch = newName; });
        cartelState.packing.forEach(p => { if (String(p.batch) === String(origName)) p.batch = newName; });
        cartelState.weed.forEach(w => { if (String(w.batch) === String(origName)) w.batch = newName; });
        cartelState.mutasi.forEach(m => { if (String(m.batch) === String(origName)) m.batch = newName; });
        (cartelState.brangkas || []).forEach(b => { if (String(b.batch) === String(origName)) b.batch = newName; });
        if (selectedDashboardBatch === origName) selectedDashboardBatch = newName;
      }

      saveCartelState();
      closeModalEditBatch();
      renderCurrentView();
      notify(`Parameter Batch ${newName} berhasil disimpan!`, '✅');
    }

    function handleCreateBatchWithTarif() {
      if (!cartelState.isAdmin) return;

      const numInput = document.getElementById('newBatchNumber');
      const val = (numInput?.value || '').trim().replace(/^Batch\s*/i, '');

      if (!val) {
        notify('Ketikkan nomor atau nama batch baru!', '⚠️');
        return;
      }

      if (cartelState.batches.some(b => String(b.name).toLowerCase() === val.toLowerCase())) {
        notify('Nomor batch tersebut sudah terdaftar!', '⚠️');
        return;
      }

      const tarifJualan = parseFormattedNumber(document.getElementById('newBatchTarifJualan').value) || 60000;
      const tarifPacking = parseFormattedNumber(document.getElementById('newBatchTarifPacking').value) || 50000;

    function calculateFlexibleSalary(params) {
      const { aksi, kategori, batch, jumlah, hilang = 0, sekalianJual = false } = params;
      const cfg = getBatchConfig(batch);
      const dendaPerUnit = Number(cfg.tarifDenda) || 300;
      const dendaNominal = Math.max(0, Number(hilang) || 0) * dendaPerUnit;

      const rateJualanPerUnit = (Number(cfg.tarifJualan) || 60000) / 500;
      const ratePackingPerUnit = (Number(cfg.tarifPacking) || 50000) / 100;
      const rateWeedPerUnit = (Number(cfg.tarifWeed) || 40000) / 100;

      if (aksi === 'AMBIL') {
        return {
          totalGaji: 0,
          baseGaji: 0,
          additionalSalesGaji: 0,
          dendaNominal: 0,
          barangTerjual: 0,
          rateJualanPerUnit,
          ratePackingPerUnit,
          rateWeedPerUnit,
          breakdownText: 'Ambil barang dari gudang / boss (Pencatatan mutasi operasional masuk, belum ada komisi setoran).'
        };
      }

      let baseGaji = 0;
      let additionalSalesGaji = 0;
      let barangTerjual = 0;
      let breakdownText = '';

      if (kategori === 'JUALAN') {
        barangTerjual = Math.max(0, (Number(jumlah) || 0) - (Number(hilang) || 0));
        baseGaji = Math.round(barangTerjual * rateJualanPerUnit);
        const totalGaji = Math.max(0, baseGaji - dendaNominal);

        breakdownText = `Jual: ${formatNumber(barangTerjual)} item × ${formatMoney(rateJualanPerUnit)} = ${formatMoney(baseGaji)}`;
        if (dendaNominal > 0) {
          breakdownText += ` | Denda: ${hilang} hilang × -${formatMoney(dendaPerUnit)} = -${formatMoney(dendaNominal)}`;
        }
        return { totalGaji, baseGaji, additionalSalesGaji: 0, dendaNominal, barangTerjual, rateJualanPerUnit, breakdownText };

      } else if (kategori === 'PACKING') {
        baseGaji = Math.round((Number(jumlah) || 0) * ratePackingPerUnit);

        if (sekalianJual) {
          barangTerjual = Math.max(0, (Number(jumlah) || 0) - (Number(hilang) || 0));
          additionalSalesGaji = Math.round(barangTerjual * rateJualanPerUnit);
          const totalGaji = Math.max(0, baseGaji + additionalSalesGaji - dendaNominal);

          breakdownText = `Pack: ${formatNumber(jumlah)} × ${formatMoney(ratePackingPerUnit)} (${formatMoney(baseGaji)}) + Jual: ${formatNumber(barangTerjual)} × ${formatMoney(rateJualanPerUnit)} (${formatMoney(additionalSalesGaji)})`;
          if (dendaNominal > 0) {
            breakdownText += ` - Denda (${formatMoney(dendaNominal)})`;
          }
          return { totalGaji, baseGaji, additionalSalesGaji, dendaNominal, barangTerjual, ratePackingPerUnit, rateJualanPerUnit, breakdownText };
        } else {
          const totalGaji = Math.max(0, baseGaji);
          breakdownText = `Pack: ${formatNumber(jumlah)} unit × ${formatMoney(ratePackingPerUnit)} = ${formatMoney(baseGaji)} (Tanpa jual).`;
          return { totalGaji, baseGaji, additionalSalesGaji: 0, dendaNominal: 0, barangTerjual: 0, ratePackingPerUnit, breakdownText };
        }

      } else if (kategori === 'WEED') {
        const estBibit = Number(params.bibit) || Math.round((Number(jumlah) || 0) / 6) || Number(jumlah) || 0;
        baseGaji = Math.round(estBibit * rateWeedPerUnit);

        if (sekalianJual) {
          barangTerjual = Math.max(0, (Number(jumlah) || 0) - (Number(hilang) || 0));
          additionalSalesGaji = Math.round(barangTerjual * rateJualanPerUnit);
          const totalGaji = Math.max(0, baseGaji + additionalSalesGaji - dendaNominal);

          breakdownText = `Weed: ~${formatNumber(estBibit)} bibit × ${formatMoney(rateWeedPerUnit)} (${formatMoney(baseGaji)}) + Jual: ${formatNumber(barangTerjual)} × ${formatMoney(rateJualanPerUnit)} (${formatMoney(additionalSalesGaji)})`;
          if (dendaNominal > 0) {
            breakdownText += ` - Denda (${formatMoney(dendaNominal)})`;
          }
          return { totalGaji, baseGaji, additionalSalesGaji, dendaNominal, barangTerjual, rateWeedPerUnit, rateJualanPerUnit, breakdownText };
        } else {
          const totalGaji = Math.max(0, baseGaji);
          breakdownText = `Weed: ~${formatNumber(estBibit)} bibit × ${formatMoney(rateWeedPerUnit)} = ${formatMoney(baseGaji)} (Panen fraksi).`;
          return { totalGaji, baseGaji, additionalSalesGaji: 0, dendaNominal: 0, barangTerjual: 0, rateWeedPerUnit, breakdownText };
        }
      }

      return { totalGaji: 0, baseGaji: 0, additionalSalesGaji: 0, dendaNominal: 0, barangTerjual: 0, breakdownText: '-' };
    }

    // ---- AMBIL ----
    function refreshAmbilForm() {
      const kat = $('u_kategori').value;

      $('u_barang').parentElement.classList.toggle('hidden', kat === 'WEED');
      $('u_jumlah').previousElementSibling.innerHTML = ({ JUALAN: 'JUMLAH YANG DIAMBIL UNTUK DIJUAL', PACKING: 'JUMLAH BAHAN YANG DIAMBIL', WEED: 'JUMLAH BIBIT YANG DIAMBIL' }[kat] || 'JUMLAH') + ' <span class="text-red-500">*</span>';

      const prev = selB.value;
      selB.innerHTML = opts.map(o => `<option value="${o}">${o}</option>`).join('');
      if (opts.includes(prev)) selB.value = prev;

      const act = getActiveBatches();
      const selBatch = $('u_batch');
      if (act.length > 1) {
        const prevBatch = selBatch.value;

      const sel = $('u_pilih_ambil');
      const kat = $('u_kategori').value;
      const prev = sel.value;
      const list = getOpenAmbilList().filter(m => !kat || m.kategori === kat);

      if (list.some(m => m.id === prev)) sel.value = prev;

    function handleAmbilSelect(fromRefresh) {
      const m = getSelectedAmbil();
      updateSubmitLabel();
      ['u_box_packing_auto', 'u_box_packing_jual', 'u_box_jualan', 'u_box_panen'].forEach(id => $(id).classList.add('hidden'));

      if (!m) {
        $('u_info_box').classList.add('hidden');
        updateLiveSalaryPreview();
        return;
      }

      $('u_info_box').classList.remove('hidden');
      $('u_s_nama').innerText = m.nama;
      $('u_s_barang').innerText = m.barang;
      $('u_s_jumlah').innerText = formatNumber(m.jumlah);
      $('u_s_batch').innerText = `Batch ${m.batch}`;

      if (!fromRefresh) {
        $('u_kategori').value = m.kategori;
        $('u_barang_hilang').value = 0;
        $('u_setoran_umer').value = '';
        $('u_panen').value = '';
        $('u_cek_lanjut_jual').checked = false;
        renderKategoriButtons();
      }

      if (m.kategori === 'PACKING') {
        $('u_box_packing_auto').classList.remove('hidden');
        $('u_pack_auto').innerText = `${formatNumber(m.jumlah * 10)} pack`;
        $('u_box_packing_jual').classList.remove('hidden');
        $('u_box_jualan').classList.toggle('hidden', !$('u_cek_lanjut_jual').checked);
      } else if (m.kategori === 'JUALAN') {
        $('u_box_jualan').classList.remove('hidden');
      } else if (m.kategori === 'WEED') {
        $('u_box_panen').classList.remove('hidden');
      }
      updateLiveSalaryPreview();
    }

    function computeSetorCalc(m) {
      const hilang = Number($('u_barang_hilang').value) || 0;
      const panen = Number($('u_panen').value) || 0;
      if (m.kategori === 'PACKING') {
        const pack = m.jumlah * 10;
        const lanjut = $('u_cek_lanjut_jual').checked;
        const hl = lanjut ? hilang : 0;
        return { pack, hilang: hl, panen: 0, calc: calculateFlexibleSalary({ aksi: 'SETOR', kategori: 'PACKING', batch: m.batch, jumlah: pack, hilang: hl, sekalianJual: lanjut }) };
      }
      if (m.kategori === 'JUALAN') {
        return { pack: 0, hilang, panen: 0, calc: calculateFlexibleSalary({ aksi: 'SETOR', kategori: 'JUALAN', batch: m.batch, jumlah: m.jumlah, hilang, sekalianJual: false }) };
      }
      return { pack: 0, hilang: 0, panen, calc: calculateFlexibleSalary({ aksi: 'SETOR', kategori: 'WEED', batch: m.batch, jumlah: panen, bibit: m.jumlah, hilang: 0, sekalianJual: false }) };
    }

    function updateLiveSalaryPreview() {
      const totalEl = $('u_preview_total_gaji');
      const textEl = $('u_preview_formula_text');
      updateSubmitLabel();
      if (!totalEl || !textEl || getAksi() !== 'SETOR') return;

      const m = getSelectedAmbil();
      if (!m) {
        totalEl.innerText = '$0';
        totalEl.className = 'font-mono-code font-black text-sm text-slate-400';
        textEl.innerText = 'Pilih nama anggota untuk melihat estimasi gaji.';
        return;
      }

      const r = computeSetorCalc(m);
      const cfg = getBatchConfig(m.batch);
      $('u_info_denda_per_item').innerText = `Denda: -${formatMoney(cfg.tarifDenda)}/item`;
      totalEl.innerText = formatMoney(r.calc.totalGaji);
      totalEl.className = 'font-mono-code font-black text-sm ' + (r.calc.totalGaji > 0 ? 'text-emerald-400' : 'text-slate-400');
      textEl.innerText = r.calc.breakdownText;
    }

    function showFormError(msg, focusId) {

      box.innerText = msg;
      box.classList.remove('hidden');

    function nowStrings() {
      const n = new Date();
      const p = (x) => String(x).padStart(2, '0');
      return {
        dateShort: `${p(n.getDate())}/${p(n.getMonth() + 1)}/${n.getFullYear()}`,
        timeFull: `${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())} ${p(n.getHours())}:${p(n.getMinutes())}`
      };
    }

    function handleUniversalFormSubmit(e) {
      e.preventDefault();
      $('u_form_error').classList.add('hidden');
      const aksi = getAksi();
      const { dateShort, timeFull } = nowStrings();

      // ===== AMBIL =====
      if (aksi === 'AMBIL') {
        const nama = $('u_nama').value.trim().toUpperCase();
        const kategori = $('u_kategori').value;
        const barang = $('u_barang').value;
        const jumlah = Number($('u_jumlah').value) || 0;
        const act = getActiveBatches();
        const batch = act.length === 1 ? act[0].name : (act.length > 1 ? $('u_batch').value : '');

        if (!batch) return showFormError('Tidak ada Batch Aktif yang tersedia!');
        if (!kategori) return showFormError('Pilih jenis pekerjaan (Jualan / Packing / Weed)!');
        if (!nama) return showFormError('Nama Anggota wajib diisi!', 'u_nama');
        if (!barang) return showFormError('Nama Barang wajib dipilih!', 'u_barang');
        if (jumlah <= 0) return showFormError('Jumlah barang minimal 1!', 'u_jumlah');

        cartelState.mutasi.unshift({
          id: 'mt-' + Date.now(), waktu: timeFull, nama, aksi: 'AMBIL', kategori, barang, jumlah,
          hilang: 0, pihak: '', setoranUmer: 0, batch, status: 'APPROVED', disetor: false
        });

        saveCartelState();
        closeModalLaporan();
        renderCurrentView();
        notify(`${nama} mengambil ${formatNumber(jumlah)} ${barang} (Batch ${batch}).`, '📥');
        return;
      }

      // ===== SETOR =====
      const m = getSelectedAmbil();
      if (!m) return showFormError('Pilih nama anggota dari daftar terlebih dahulu!', 'u_pilih_ambil');

      let setoranUmer = 0;
      const lanjutJual = m.kategori === 'PACKING' && $('u_cek_lanjut_jual').checked;
      if (m.kategori === 'JUALAN' || lanjutJual) {
        if ($('u_barang_hilang').value.trim() === '') return showFormError('Jumlah hilang wajib diisi (isi 0 jika tidak ada)!', 'u_barang_hilang');
        if (Number($('u_barang_hilang').value) > (m.kategori === 'PACKING' ? m.jumlah * 10 : m.jumlah)) return showFormError('Jumlah hilang melebihi jumlah yang diambil!', 'u_barang_hilang');
        if (!$('u_setoran_umer').value.trim()) return showFormError('Setoran Uang Merah wajib diisi!', 'u_setoran_umer');
        setoranUmer = parseFormattedNumber($('u_setoran_umer').value);
      }
      if (m.kategori === 'WEED' && (Number($('u_panen').value) || 0) <= 0) {
        return showFormError('Jumlah hasil panen wajib diisi!', 'u_panen');
      }

      const r = computeSetorCalc(m);
      const calc = r.calc;
      const newMutasiId = 'mt-' + Date.now();
      const uid = Date.now();
      let jumlahLog = m.jumlah;
      let barangLog = m.barang;

      if (m.kategori === 'JUALAN') {
        cartelState.jualan.unshift({
          id: 'jl-' + uid, mutasiId: newMutasiId, tanggal: dateShort, batch: m.batch, sales: m.nama, barang: m.barang,
          diambil: m.jumlah, terjual: calc.barangTerjual, sisa: 0, setoranUmer, hilang: r.hilang,
          denda: calc.dendaNominal, totalGaji: calc.totalGaji, status: 'MENUNGGU'
        });
      } else if (m.kategori === 'PACKING') {
        jumlahLog = r.pack;
        cartelState.packing.unshift({
          id: 'pk-' + uid, mutasiId: newMutasiId, tanggal: dateShort, batch: m.batch, nama: m.nama, barang: m.barang,
          mentah: m.jumlah, pack: r.pack, sekalianJual: lanjutJual, setoranUmer, hilang: r.hilang,
          denda: calc.dendaNominal, gaji: calc.totalGaji, status: 'MENUNGGU'
        });
      } else {
        jumlahLog = r.panen;
        barangLog = 'WEED';
        cartelState.weed.unshift({
          id: 'wd-' + uid, mutasiId: newMutasiId, tanggal: dateShort, batch: m.batch, petani: m.nama,
          bibit: m.jumlah, panen: r.panen, pack: Math.round(r.panen / 10), sekalianJual: false, setoranUmer: 0, hilang: 0,
          denda: calc.dendaNominal, gaji: calc.totalGaji, status: 'MENUNGGU'
        });
      }

      cartelState.mutasi.unshift({
        id: newMutasiId, waktu: timeFull, nama: m.nama, aksi: 'SETOR', kategori: m.kategori, barang: barangLog,
        jumlah: jumlahLog, hilang: r.hilang, pihak: '', setoranUmer, batch: m.batch, status: 'PENDING', ambilId: m.id, sekalianJual: lanjutJual
      });

      m.disetor = true;
      m.setorMutasiId = newMutasiId;

      saveCartelState();
      closeModalLaporan();
      renderCurrentView();
      notify(`Setoran ${m.nama} terkirim! Menunggu konfirmasi Boss.`, '📤');
    }

    function submitEditJumlahAmbil(e) {

    function openModalEditMutasi(id) {
      if (!cartelState.isAdmin) return;
      const m = cartelState.mutasi.find(x => x.id === id);
      if (!m) return;

      document.getElementById('edit_id').value = m.id;
      document.getElementById('edit_nama').value = m.nama;
      document.getElementById('edit_batch').value = m.batch;
      document.getElementById('edit_kategori').value = `${m.aksi} - ${m.kategori}`;
      document.getElementById('edit_barang').value = m.barang;
      document.getElementById('edit_jumlah').value = m.jumlah;
      document.getElementById('edit_hilang').value = m.hilang || 0;
      document.getElementById('edit_pihak').value = m.pihak;

    function handleEditMutasiSubmit(e) {
      e.preventDefault();
      if (!cartelState.isAdmin) return;

      const id = document.getElementById('edit_id').value;
      const m = cartelState.mutasi.find(x => x.id === id);
      if (!m) return;

      const newNama = document.getElementById('edit_nama').value.trim().toUpperCase();
      const newBatch = document.getElementById('edit_batch').value.trim();
      const newBarang = document.getElementById('edit_barang').value.trim();
      const newJumlah = Number(document.getElementById('edit_jumlah').value) || 0;
      const newHilang = Number(document.getElementById('edit_hilang').value) || 0;
      const newPihak = document.getElementById('edit_pihak').value.trim();
      const newSetoranUmer = parseFormattedNumber(document.getElementById('edit_setoran_umer').value);
      const newStatus = document.getElementById('edit_status').value;

      m.nama = newNama;
      m.batch = newBatch;
      m.barang = newBarang;
      m.jumlah = newJumlah;
      m.hilang = newHilang;
      m.pihak = newPihak;
      m.setoranUmer = newSetoranUmer;
      if (m.aksi === 'SETOR' && m.status !== newStatus) toggleKonfirmasi(m);

      const jl = m.aksi !== 'SETOR' ? null : cartelState.jualan.find(x => x.mutasiId === id);
      if (jl) {
        const c = calculateFlexibleSalary({
          aksi: 'SETOR',
          kategori: 'JUALAN',
          batch: newBatch,
          jumlah: newJumlah,
          hilang: newHilang,
          sekalianJual: false
        });
        jl.sales = newNama;
        jl.batch = newBatch;
        jl.barang = newBarang;
        jl.diambil = newJumlah;
        jl.terjual = c.barangTerjual;
        jl.hilang = newHilang;
        jl.denda = c.dendaNominal;
        jl.setoranUmer = newSetoranUmer;
        jl.totalGaji = c.totalGaji;
      }

      const pk = m.aksi !== 'SETOR' ? null : cartelState.packing.find(x => x.mutasiId === id);
      if (pk) {
        const c = calculateFlexibleSalary({
          aksi: 'SETOR',
          kategori: 'PACKING',
          batch: newBatch,
          jumlah: newJumlah,
          hilang: newHilang,
          sekalianJual: pk.sekalianJual
        });
        pk.nama = newNama;
        pk.batch = newBatch;
        pk.barang = newBarang;
        pk.pack = newJumlah;
        pk.hilang = newHilang;
        pk.denda = c.dendaNominal;
        pk.setoranUmer = newSetoranUmer;
        pk.gaji = c.totalGaji;
      }

      const wd = m.aksi !== 'SETOR' ? null : cartelState.weed.find(x => x.mutasiId === id);
      if (wd) {
        const c = calculateFlexibleSalary({
          aksi: 'SETOR',
          kategori: 'WEED',
          batch: newBatch,
          jumlah: newJumlah,
          hilang: newHilang,
          sekalianJual: wd.sekalianJual,
          bibit: wd.bibit
        });
        wd.petani = newNama;
        wd.batch = newBatch;
        wd.panen = newJumlah;
        wd.hilang = newHilang;
        wd.denda = c.dendaNominal;
        wd.setoranUmer = newSetoranUmer;
        wd.gaji = c.totalGaji;
      }

      saveCartelState();
      closeModalEditMutasi();
      renderCurrentView();
      notify(`Laporan untuk ${newNama} berhasil diperbarui dengan kalkulasi prorata!`, '✏️');
    }
