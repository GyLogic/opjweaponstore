    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function brangkasUmerKumpul(batchSet) {
      let t = 0;
      [...cartelState.jualan, ...cartelState.packing, ...cartelState.weed].forEach(r => {
        if (r.status === 'MENUNGGU') return; // hanya setoran yang sudah dikonfirmasi Boss
        if (batchSet && !batchSet.has(String(r.batch))) return;
        t += Number(r.setoranUmer) || 0;
      });
      return t;
    }

    function brangkasStats(batch, excludeId) {
      const isAll = !batch || batch === 'ALL';
      const list = (cartelState.brangkas || []).filter(r => r.id !== excludeId && (isAll || String(r.batch) === String(batch)));
      const cuci = list.filter(r => r.tipe === 'CUCI');
      const atas = list.filter(r => r.tipe === 'ATASAN');
      const sum = (arr, f) => arr.reduce((a, r) => a + (Number(f(r)) || 0), 0);
      const kumpul = brangkasUmerKumpul(isAll ? null : new Set([String(batch)]));
      const merahDicuci = sum(cuci, r => r.nominalMerah);
      const diterima = cuci.filter(r => r.uangBersih != null);
      const merahDiterima = sum(diterima, r => r.nominalMerah);
      const bersih = sum(diterima, r => r.uangBersih);
      const disetor = sum(atas, r => r.nominalBersih);
      return {
        cuci, atas, kumpul, merahDicuci, sisaMerah: kumpul - merahDicuci,
        merahMenunggu: sum(cuci.filter(r => r.uangBersih == null), r => r.nominalMerah),
        bersih, selisih: merahDiterima - bersih, rate: merahDiterima > 0 ? (bersih / merahDiterima) * 100 : 0,
        disetor, saldoBersih: bersih - disetor
      };
    }

    function renderBrangkas() {
      const sel = $('brangkasBatchFilter');
      if (!sel) return;
      const prev = sel.value || 'ALL';
      sel.innerHTML = `<option value="ALL">Semua Batch</option>` + cartelState.batches.map(b => `<option value="${esc(b.name)}">Batch ${esc(b.name)}</option>`).join('');
      sel.value = [...sel.options].some(o => o.value === prev) ? prev : 'ALL';
      const batch = sel.value;
      const isAll = batch === 'ALL';
      const s = brangkasStats(batch);

      const step = (no, label, val, sub, color) => `
        <div class="p-3 rounded-2xl bg-[#141a24] border border-[#273247] border-t-2 ${color.border}">
          <div class="text-[10px] text-slate-400 uppercase">${no}. ${label}</div>
          <div class="font-rajdhani font-black text-xl ${color.text} mt-0.5">${val}</div>
          <div class="text-[10px] text-slate-500">${sub}</div>
        </div>`;
      $('brangkasFlow').innerHTML =
        step(1, 'Uang Merah Terkumpul', formatMoney(s.kumpul), 'Setoran anggota (sudah dikonfirmasi)', { border: 'border-t-red-500', text: 'text-red-400' }) +
        step(2, 'Disetor ke Kelompok', formatMoney(s.merahDicuci), `Sisa belum dicuci: ${formatMoney(s.sisaMerah)}`, { border: 'border-t-amber-500', text: 'text-amber-400' }) +
        step(3, 'Uang Bersih Didapat', formatMoney(s.bersih), `Rate cuci: ${s.rate ? s.rate.toFixed(1) + '%' : '-'}`, { border: 'border-t-cyan-500', text: 'text-cyan-400' }) +
        step(4, 'Disetor ke Atasan', formatMoney(s.disetor), `Saldo bersih: ${formatMoney(s.saldoBersih)}`, { border: 'border-t-emerald-500', text: 'text-emerald-400' });

      const mini = (label, val, cls) => `<div class="p-2.5 rounded-xl bg-[#0d121a] border border-[#242f43]"><div class="text-[10px] text-slate-500 uppercase">${label}</div><div class="font-black ${cls}">${val}</div></div>`;
      $('brangkasStats').innerHTML =
        mini('Sisa uang merah belum dicuci', formatMoney(s.sisaMerah), s.sisaMerah < 0 ? 'text-rose-400' : 'text-amber-300') +
        mini('Merah menunggu hasil cuci', formatMoney(s.merahMenunggu), 'text-amber-300') +
        mini('Potongan / biaya cuci', formatMoney(s.selisih), 'text-rose-400') +
        mini('Saldo uang bersih di Boss', formatMoney(s.saldoBersih), s.saldoBersih < 0 ? 'text-rose-400' : 'text-emerald-400');

      // per kelompok
      const kel = {};
      s.cuci.forEach(r => {
        const k = (r.kelompok || '-').toUpperCase();
        const o = kel[k] || (kel[k] = { n: 0, merah: 0, merahOk: 0, bersih: 0, tunggu: 0 });
        o.n++; o.merah += Number(r.nominalMerah) || 0;
        if (r.uangBersih != null) { o.merahOk += Number(r.nominalMerah) || 0; o.bersih += Number(r.uangBersih) || 0; }
        else o.tunggu += Number(r.nominalMerah) || 0;
      });
      $('brangkasKelompok').innerHTML = Object.keys(kel).length ? Object.keys(kel).map(k => {
        const o = kel[k];
        return `<div class="p-2.5 rounded-xl bg-[#141a24] border border-[#242f43] space-y-1">
          <div class="flex items-center justify-between"><span class="font-bold text-white">Kelompok ${esc(k)} <span class="text-[10px] text-slate-500">(${o.n} transaksi)</span></span>
          <span class="font-black text-cyan-400">${formatMoney(o.bersih)}</span></div>
          <div class="text-[10px] text-slate-400">Merah disetor: <strong class="text-red-400">${formatMoney(o.merah)}</strong> | Rate: ${o.merahOk ? (o.bersih / o.merahOk * 100).toFixed(1) + '%' : '-'} | Potongan: ${formatMoney(o.merahOk - o.bersih)}${o.tunggu ? ` | ⏳ Menunggu: ${formatMoney(o.tunggu)}` : ''}</div>
        </div>`;
      }).join('') : `<p class="text-slate-500 py-2">Belum ada uang merah yang disetor ke kelompok.</p>`;

      // per atasan
      const at = {};
      s.atas.forEach(r => {
        const k = (r.atasan || '-').toUpperCase();
        const o = at[k] || (at[k] = { n: 0, total: 0, last: '' });
        o.n++; o.total += Number(r.nominalBersih) || 0;
        if (!o.last || r.waktu > o.last) o.last = r.waktu;
      });
      $('brangkasAtasan').innerHTML = Object.keys(at).length ? Object.keys(at).map(k => `
        <div class="p-2.5 rounded-xl bg-[#141a24] border border-[#242f43] space-y-1">
          <div class="flex items-center justify-between"><span class="font-bold text-white">${esc(k)} <span class="text-[10px] text-slate-500">(${at[k].n} setoran)</span></span>
          <span class="font-black text-emerald-400">${formatMoney(at[k].total)}</span></div>
          <div class="text-[10px] text-slate-400">Setoran terakhir: ${esc(at[k].last)}</div>
        </div>`).join('') : `<p class="text-slate-500 py-2">Belum ada uang bersih yang disetor ke atasan.</p>`;

      // buku besar
      const rows = (cartelState.brangkas || []).filter(r => isAll || String(r.batch) === batch);
      $('tbodyBrangkas').innerHTML = rows.length ? rows.map(r => {
        const isC = r.tipe === 'CUCI';
        const ok = r.uangBersih != null;
        return `<tr class="hover:bg-[#141a24]/80 transition">
          <td><div class="text-[10px] text-slate-400">${esc(r.waktu)}</div><span class="px-1.5 rounded bg-slate-800 text-slate-300 text-[9px]">B-${esc(r.batch)}</span></td>
          <td><span class="px-1.5 py-0.5 rounded text-[9px] font-bold ${isC ? 'bg-red-500/20 text-red-300' : 'bg-emerald-500/20 text-emerald-300'}">${isC ? '🧼 CUCI' : '📤 SETOR ATASAN'}</span></td>
          <td class="font-bold text-white uppercase">${isC ? 'Kelompok ' + esc(r.kelompok) : esc(r.atasan)}</td>
          <td class="text-right text-red-400 font-bold">${isC ? formatMoney(r.nominalMerah) : '-'}</td>
          <td class="text-right font-bold ${isC ? (ok ? 'text-emerald-400' : 'text-amber-400') : 'text-emerald-400'}">${isC ? (ok ? formatMoney(r.uangBersih) : '⏳ belum diterima') : formatMoney(r.nominalBersih)}</td>
          <td class="text-right text-[10px] text-slate-400">${isC && ok ? `${(r.uangBersih / r.nominalMerah * 100).toFixed(1)}% | -${formatMoney(r.nominalMerah - r.uangBersih)}` : '-'}</td>
          <td class="text-[10px] text-slate-400">${esc(r.catatan) || '-'}</td>
          <td class="text-center whitespace-nowrap">
            <button onclick="openBrangkasModal('${r.id}')" class="text-amber-400 hover:text-amber-300 text-[10px] font-bold">Edit</button>
            <span class="text-slate-600">|</span>
            <button onclick="deleteBrangkas('${r.id}')" class="text-rose-400 hover:text-rose-300 text-[10px] font-bold">Hapus</button>
          </td></tr>`;
      }).join('') : `<tr><td colspan="8" class="text-center py-6 text-slate-500">Belum ada catatan brankas.</td></tr>`;
    }

    function brTipe() { const r = document.querySelector('input[name="br_tipe"]:checked'); return r ? r.value : 'CUCI'; }

    function setBrTipe() {
      const t = brTipe();
      $('br_box_cuci').classList.toggle('hidden', t !== 'CUCI');
      $('br_box_atasan').classList.toggle('hidden', t !== 'ATASAN');
      updateBrHint();
    }

    function updateBrHint() {
      const t = brTipe();
      const batch = $('br_batch').value;
      const s = brangkasStats(batch, $('br_id').value);
      let html = '';
      if (t === 'CUCI') {
        const merah = parseFormattedNumber($('br_merah').value);
        const bStr = $('br_bersih').value.trim();
        const bersih = parseFormattedNumber(bStr);
        html = `Sisa uang merah belum dicuci (Batch ${esc(batch)}): <strong class="${s.sisaMerah - merah < 0 ? 'text-red-400' : 'text-amber-300'}">${formatMoney(s.sisaMerah)}</strong>`;
        if (merah > 0 && bStr) html += `<br>Rate pencucian: <strong class="text-cyan-300">${(bersih / merah * 100).toFixed(1)}%</strong> | Potongan: <strong class="text-rose-300">${formatMoney(merah - bersih)}</strong>`;
      } else {
        const nom = parseFormattedNumber($('br_nominal_bersih').value);
        html = `Saldo uang bersih belum disetor (Batch ${esc(batch)}): <strong class="${s.saldoBersih - nom < 0 ? 'text-red-400' : 'text-emerald-300'}">${formatMoney(s.saldoBersih)}</strong>`;
      }
      $('br_hint').innerHTML = html;
    }

    function openBrangkasModal(id) {

      const batchNow = r ? String(r.batch) : (fSel && fSel.value && fSel.value !== 'ALL' ? fSel.value : (active ? String(active.name) : ''));

      $('br_batch').innerHTML = cartelState.batches.map(b => `<option value="${esc(b.name)}" ${String(b.name) === batchNow ? 'selected' : ''}>Batch ${esc(b.name)}</option>`).join('');
      $('br_id').value = r ? r.id : '';
      $('br_title').innerText = r ? '✏️ EDIT CATATAN BRANKAS' : '🏦 SETORAN KE BRANKAS';
      document.querySelector(`input[name="br_tipe"][value="${r ? r.tipe : 'CUCI'}"]`).checked = true;
      $('br_tipe_wrap').classList.toggle('pointer-events-none', !!r);

      $('br_bersih').value = r ? fmt(r.uangBersih) : '';
      $('br_atasan').value = r ? (r.atasan || '') : '';
      $('br_nominal_bersih').value = r ? fmt(r.nominalBersih) : '';

      $('modalBrangkas').classList.remove('hidden');

    function closeBrangkasModal() { $('modalBrangkas').classList.add('hidden'); }

    function submitBrangkas(e) {
      e.preventDefault();
      if (!cartelState.isAdmin) return;
      const err = (msg) => { const b = $('br_form_error'); b.innerText = msg; b.classList.remove('hidden'); };
      const tipe = brTipe();
      const batch = $('br_batch').value;
      const catatan = $('br_catatan').value.trim();
      if (!batch) return err('Pilih batch terlebih dahulu!');

      const data = { tipe, batch, catatan };
      if (tipe === 'CUCI') {
        const kelompok = $('br_kelompok').value.trim().toUpperCase();
        const merah = parseFormattedNumber($('br_merah').value);
        const bStr = $('br_bersih').value.trim();
        const bersih = bStr === '' ? null : parseFormattedNumber(bStr);
        if (!kelompok) return err('Isi nama kelompok tujuan uang merah!');
        if (merah <= 0) return err('Nominal uang merah wajib diisi!');
        if (bersih !== null && bersih > merah) return err('Uang bersih tidak boleh melebihi uang merah yang dicuci!');
        Object.assign(data, { kelompok, nominalMerah: merah, uangBersih: bersih });
      } else {
        const atasan = $('br_atasan').value.trim().toUpperCase();

    function resetDefaultData() {

<script>
/* BenefitEngine - fungsi murni (tanpa DOM). Dipakai browser (window.BenefitEngine) & tes Node. */
(function (root) {
  const DEFAULT_SETTINGS = {
    weekly: { ms: 100, sm: 2, cash: 30000 },
    eligibility: 'any',            // 'any' = setoran apa pun | 'ms' = wajib pernah setor Metal Scrap
    markupPct: 30,                 // kenaikan harga bila TIDAK rutin
    markupBelowStreak: 2,          // streak < nilai ini = tidak rutin
    streakTiers: [ {weeks:2,pct:3},{weeks:4,pct:5},{weeks:6,pct:10},{weeks:8,pct:15},{weeks:10,pct:20},{weeks:12,pct:25} ],
    voucher: { weeks: 16, amount: 200000 },
    gajiTiers: [ {min:200000,pct:10},{min:300000,pct:15},{min:450000,pct:20} ],
    gajiBatch: 'auto',             // 'auto' = batch selesai bernomor tertinggi, atau nama batch manual
    aliases: {}                    // { 'NAMA DI BARHAM': 'memberId' }
  };
  const num = v => Number(v) || 0;
  const weekOfDay = d => d <= 7 ? 1 : d <= 14 ? 2 : d <= 21 ? 3 : 4;
  const slotIndex = (y, m, w) => y * 48 + (m - 1) * 4 + (w - 1);
  const slotOfDate = dt => slotIndex(dt.getFullYear(), dt.getMonth() + 1, weekOfDay(dt.getDate()));
  function slotEnd(idx) {                     // akhir slot (ms epoch, waktu lokal)
    const y = Math.floor(idx / 48), r = idx % 48, m = Math.floor(r / 4) + 1, w = (r % 4) + 1;
    const lastDay = w === 4 ? new Date(y, m, 0).getDate() : w * 7;
    return new Date(y, m - 1, lastDay, 23, 59, 59, 999).getTime();
  }
  const fracOf = (o, wk) => num(o.ms) / wk.ms + num(o.sm) / wk.sm + num(o.cash) / wk.cash;

  /* Streak = jumlah minggu BERURUTAN yang lunas TEPAT WAKTU, dihitung mundur dari minggu sebelum minggu ini.
     Setoran yang baru diserahkan setelah minggu itu lewat (cicil susulan / borongan saat belanja) tidak dihitung. */
  function computeStreak(memberId, deposits, now, wk) {
    const cur = slotOfDate(now), paid = {};
    deposits.filter(d => String(d.memberId) === String(memberId)).forEach(d => {
      const t = new Date(d.dateTime); if (isNaN(t)) return;
      const m = parseInt(d.month, 10), w = parseInt(String(d.week).replace(/\D/g, ''), 10) || 1;
      const idx = slotIndex(t.getFullYear(), m, Math.min(4, w));
      if (idx >= cur) return;                         // hanya minggu-minggu sebelumnya
      if (t.getTime() > slotEnd(idx)) return;         // terlambat
      paid[idx] = (paid[idx] || 0) + fracOf(d, wk);
    });
    let s = 0;
    while (paid[cur - 1 - s] >= 1 - 1e-6) s++;
    return { streak: s, startSlot: cur - s };
  }

  function findBarhamName(member, aliases, name) {
    const n = String(name || '').trim().toLowerCase();
    if (!n) return false;
    for (const k in aliases) if (k.trim().toLowerCase() === n) return String(aliases[k]) === String(member.id);
    return n === String(member.nickname).trim().toLowerCase();
  }
  function pickBatch(barham, setting) {
    const b = (barham && barham.batches) || [];
    if (setting && setting !== 'auto') return String(setting);
    const done = b.filter(x => x.status === 'selesai').map(x => x.name).sort((a, c) => parseFloat(c) - parseFloat(a));
    return done[0] || null;
  }
  function computeGaji(member, barham, S) {
    const batch = pickBatch(barham, S.gajiBatch);
    if (!barham || !batch) return { batch, total: 0 };
    let total = 0;
    const add = (rows, nameKey, gajiKey) => (rows || []).forEach(r => {
      if (String(r.batch) === batch && findBarhamName(member, S.aliases, r[nameKey])) total += num(r[gajiKey]);
    });
    add(barham.jualan, 'sales', 'totalGaji'); add(barham.packing, 'nama', 'gaji'); add(barham.weed, 'petani', 'gaji');
    return { batch, total };
  }
  const topTier = (tiers, val, key) => tiers.filter(t => val >= t[key]).reduce((a, t) => t, null);

  function evaluate(o) {
    const S = Object.assign({}, DEFAULT_SETTINGS, o.settings || {});
    const wk = S.weekly, now = o.now || new Date(), member = o.member;
    const mine = (o.deposits || []).filter(d => String(d.memberId) === String(member.id));
    const eligible = S.eligibility === 'ms' ? mine.some(d => num(d.ms) > 0) : mine.some(d => fracOf(d, wk) > 0);
    const { streak, startSlot } = computeStreak(member.id, o.deposits || [], now, wk);
    const gaji = computeGaji(member, o.barham, S);
    const streakTier = topTier([...S.streakTiers].sort((a, b) => a.weeks - b.weeks), streak, 'weeks');
    const gajiTier = topTier([...S.gajiTiers].sort((a, b) => a.min - b.min), gaji.total, 'min');
    const cycle = Math.floor(streak / S.voucher.weeks), key = startSlot + ':' + cycle;
    const claimed = ((o.claims || {})[member.id] || []).includes(key);
    const voucherAvailable = cycle > 0 && !claimed;
    const routine = streak >= S.markupBelowStreak;
    return { eligible, streak, routine, gaji, markupPct: routine ? 0 : S.markupPct,
      streakPct: streakTier ? streakTier.pct : 0, gajiPct: gajiTier ? gajiTier.pct : 0,
      voucher: { available: voucherAvailable, amount: S.voucher.amount, weeks: S.voucher.weeks, key } };
  }

  /* Hitung harga akhir. Persentase DIJUMLAHKAN (markup - diskon streak - diskon gaji).
     Jika voucher dipakai: semua diskon & markup dinonaktifkan, total dipotong nilai voucher. */
  function price(base, ev, useVoucher) {
    if (useVoucher && ev.voucher.available) {
      const off = Math.min(base, ev.voucher.amount);
      return { total: base - off, netPct: 0, voucherUsed: off, factor: base ? (base - off) / base : 1 };
    }
    const netPct = ev.markupPct - ev.streakPct - ev.gajiPct;
    const f = Math.max(0, 1 + netPct / 100);
    return { total: Math.round(base * f), netPct, voucherUsed: 0, factor: f };
  }
  const api = { DEFAULT_SETTINGS, evaluate, price, computeStreak, weekOfDay };
  if (typeof module !== 'undefined') module.exports = api; else root.BenefitEngine = api;
})(typeof window !== 'undefined' ? window : globalThis);

/* OPJPicker - kolom nama anggota dengan saran otomatis (perilaku sama dengan Setor Mandiri OPJMS).
   Sumber anggota: localStorage 'opj_members' (dikelola di tab OPJMS). */
(function (root) {
  const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const members = () => { try { return JSON.parse(localStorage.getItem('opj_members')) || []; } catch (e) { return []; } };
  function matches(q) {
    const all = members(); q = q.trim().toLowerCase();
    const byName = (a, b) => a.nickname.localeCompare(b.nickname, 'id', { sensitivity: 'base' });
    if (!q) return [...all].sort(byName);
    const score = m => { const n = m.nickname.toLowerCase();
      if (n.startsWith(q)) return 0; if (n.split(/[\s/]+/).some(w => w.startsWith(q))) return 1; if (n.includes(q)) return 2;
      if ((m.passport||'').toLowerCase().includes(q) || (m.discord||'').toLowerCase().includes(q)) return 3; return -1; };
    return all.map(m => ({ m, s: score(m) })).filter(x => x.s >= 0).sort((a, b) => a.s - b.s || byName(a.m, b.m)).map(x => x.m);
  }
  function attach(input, opts) {
    opts = opts || {};
    const wrap = document.createElement('div'); wrap.style.position = 'relative';
    input.parentNode.insertBefore(wrap, input); wrap.appendChild(input);
    input.setAttribute('autocomplete', 'off'); input.spellcheck = false;
    const list = document.createElement('div');
    list.style.cssText = 'display:none;position:absolute;z-index:60;left:0;right:0;top:100%;margin-top:4px;max-height:256px;overflow-y:auto;background:#0b0f19;border:1px solid #2d3a52;border-radius:12px;box-shadow:0 10px 30px #000a';
    const hint = document.createElement('div');
    hint.style.cssText = 'display:none;font-size:11px;color:#fda4af;margin-top:4px';
    hint.textContent = 'Pilih salah satu nama dari daftar saran.';
    wrap.appendChild(list); wrap.appendChild(hint);
    let sel = null, idx = -1, items = [], showAll = false;
    const on = () => !opts.enabled || opts.enabled();
    const open = () => { if (on()) list.style.display = 'block'; }, close = () => { list.style.display = 'none'; idx = -1; };
    const emit = () => opts.onPick && opts.onPick(sel);
    function render() {
      const q = showAll ? '' : input.value.trim(); items = matches(q);
      if (idx >= items.length) idx = items.length - 1;
      if (!items.length) { list.innerHTML = '<div style="padding:12px 14px;font-size:12px;color:#6b7280">Nama tidak ditemukan. Cek lagi ejaanmu.</div>'; return; }
      const ql = q.toLowerCase();
      list.innerHTML = items.map((m, i) => { const n = m.nickname, at = ql ? n.toLowerCase().indexOf(ql) : -1;
        const nm = at >= 0 ? esc(n.slice(0, at)) + '<span style="color:#fbbf24">' + esc(n.slice(at, at + ql.length)) + '</span>' + esc(n.slice(at + ql.length)) : esc(n);
        return '<div data-id="' + esc(m.id) + '" style="padding:8px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;' + (i === idx ? 'background:rgba(245,158,11,.2)' : '') + '"><span style="font-weight:700;color:#fff;font-size:13px">' + nm + '</span><span style="font-size:10px;color:#9ca3af">' + esc(m.role) + '</span></div>'; }).join('');
      const a = list.children[idx]; if (a && a.scrollIntoView) a.scrollIntoView({ block: 'nearest' });
    }
    function pick(id) { const m = members().find(x => x.id === id); if (!m) return;
      sel = m; input.value = m.nickname; hint.style.display = 'none'; close(); emit(); }
    function resolve(showHint) {
      if (!on()) { hint.style.display = 'none'; return; }
      if (sel) { hint.style.display = 'none'; return; }
      const t = input.value.trim().toLowerCase(); if (!t) { hint.style.display = 'none'; return; }
      const ex = members().filter(m => m.nickname.toLowerCase() === t);
      if (ex.length === 1) { sel = ex[0]; input.value = sel.nickname; hint.style.display = 'none'; emit(); }
      else if (showHint && !opts.free) hint.style.display = 'block';
    }
    input.addEventListener('input', () => { if (!on()) { sel = null; return; } const had = !!sel; sel = null; showAll = false; idx = -1; hint.style.display = 'none';
      const t = input.value.trim().toLowerCase(), ex = t ? members().filter(m => m.nickname.toLowerCase() === t) : [];
      if (ex.length === 1) sel = ex[0]; open(); render(); if (had || sel) emit(); });
    const onOpen = () => { if (!on()) return; if (list.style.display === 'none') { showAll = !!sel; idx = -1; } open(); render(); };
    input.addEventListener('focus', onOpen); input.addEventListener('click', onOpen);
    input.addEventListener('blur', () => { close(); resolve(true); });
    input.addEventListener('keydown', e => { const isOpen = list.style.display !== 'none';
      if (e.key === 'ArrowDown') { e.preventDefault(); if (!isOpen) { onOpen(); return; } idx = Math.min(idx + 1, items.length - 1); render(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); if (isOpen) { idx = Math.max(idx - 1, 0); render(); } }
      else if (e.key === 'Enter') { if (isOpen && items.length) { e.preventDefault(); pick(items[idx >= 0 ? idx : 0].id); } }
      else if (e.key === 'Escape') close(); });
    list.addEventListener('mousedown', e => { const it = e.target.closest('[data-id]'); if (it) { e.preventDefault(); pick(it.dataset.id); } });
    return { get member() { return sel; }, clear() { sel = null; input.value = ''; hint.style.display = 'none'; close(); emit(); }, set: pick };
  }
  root.OPJPicker = { attach, members };
})(window);

</script>
<script>
/* Panel Pengaturan Benefit (di shell). Menyimpan ke localStorage 'opj_benefit_settings'. */
(function () {
  const BE = window.BenefitEngine, D = BE.DEFAULT_SETTINGS, KEY = 'opj_benefit_settings';
  const rd = (k, f) => { try { return JSON.parse(localStorage.getItem(k)) || f; } catch (e) { return f; } };
  const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  const css = 'background:#0b0f19;border:1px solid #2d3a52;border-radius:8px;color:#fff;padding:5px 8px;font-size:12px;';

  const num = (n, v, w) => '<input type="number" step="any" data-k="' + n + '" value="' + esc(v) + '" style="' + css + 'width:' + (w || 90) + 'px">';
  const tier = (kind, t, a, b) => '<div class="tr" data-kind="' + kind + '" style="display:flex;gap:6px;align-items:center;margin:3px 0">' + num('a', t[a], 90) + ' → ' + num('b', t.pct, 70) + '% <button type="button" data-del style="' + css + 'cursor:pointer">✕</button></div>';
  function barhamNames() {
    const s = rd('BARHAM_UNDERGROUND_CARTEL_V7_STATE', {}), out = new Set();
    (s.jualan || []).forEach(r => r.sales && out.add(String(r.sales).trim().toUpperCase()));
    (s.packing || []).forEach(r => r.nama && out.add(String(r.nama).trim().toUpperCase()));

  }
  function open() {
    if (localStorage.getItem('opj_is_admin') !== 'true') { alert('Login Admin dulu di tab OPJMS untuk mengubah pengaturan benefit.'); return; }
    const S = Object.assign({}, D, rd(KEY, {})), ms = OPJPicker.members(), al = S.aliases || {};
    const rows = barhamNames().map(n => { const auto = ms.some(m => m.nickname.trim().toLowerCase() === n.toLowerCase());
      return '<div style="display:flex;gap:8px;align-items:center;margin:3px 0"><span style="width:150px;font-size:12px">' + esc(n) + '</span><select data-alias="' + esc(n) + '" style="' + css + '"><option value="">' + (auto ? '✓ cocok otomatis' : '(bukan anggota)') + '</option>'
        + ms.map(m => '<option value="' + esc(m.id) + '"' + (String(al[n]) === String(m.id) ? ' selected' : '') + '>' + esc(m.nickname) + '</option>').join('') + '</select></div>'; }).join('');
    ov.innerHTML = '<div style="max-width:620px;margin:0 auto;background:#121a2a;border:1px solid #2d3a52;border-radius:14px;padding:18px;color:#cbd5e1;font-size:13px">'
      + '<h2 style="margin:0 0 10px;color:#f59e0b">Pengaturan Benefit WeaponStore</h2>'
      + '<p style="color:#94a3b8;font-size:11px;margin:0 0 10px">Setoran mingguan (100 MS / 2 SM / Rp30.000) mengikuti konstanta OPJMS dan tidak diubah di sini.</p>'
      + '<b>Harga naik jika tidak rutin</b><div style="margin:4px 0">+ ' + num('markupPct', S.markupPct, 70) + '% bila streak &lt; ' + num('markupBelowStreak', S.markupBelowStreak, 60) + ' minggu</div>'
      + '<b>Diskon rutin setor (minggu berturut-turut → diskon)</b><div id="st-streak">' + S.streakTiers.map(t => tier('s', t, 'weeks')).join('') + '</div><button type="button" data-add="s" style="' + css + 'cursor:pointer">+ baris</button>'
      + '<div style="margin:8px 0 0"><b>Voucher:</b> rutin ' + num('vWeeks', S.voucher.weeks, 60) + ' minggu → voucher ' + num('vAmount', S.voucher.amount, 100) + '</div>'
      + '<div style="margin-top:10px"><b>Diskon gaji batch (total gaji ≥ → diskon)</b></div><div id="st-gaji">' + S.gajiTiers.map(t => tier('g', t, 'min')).join('') + '</div><button type="button" data-add="g" style="' + css + 'cursor:pointer">+ baris</button>'
      + '<div style="margin-top:10px"><b>Batch gaji:</b> <input data-k="gajiBatch" value="' + esc(S.gajiBatch) + '" style="' + css + 'width:90px"> <span style="color:#94a3b8;font-size:11px">"auto" = batch selesai bernomor tertinggi, atau ketik nama batch</span></div>'
      + '<div style="margin-top:8px"><b>Syarat belanja:</b> <select data-k="eligibility" style="' + css + '"><option value="any"' + (S.eligibility === 'any' ? ' selected' : '') + '>pernah setor apa pun</option><option value="ms"' + (S.eligibility === 'ms' ? ' selected' : '') + '>wajib pernah setor Metal Scrap</option></select></div>'
      + '<div style="margin-top:12px"><b>Samakan nama Barham dengan anggota OPJMS</b></div><div style="max-height:200px;overflow:auto">' + (rows || '<i style="color:#64748b">Belum ada data Barham.</i>') + '</div>'
      + '<div style="display:flex;gap:8px;margin-top:14px"><button data-save style="' + css + 'background:#f59e0b;color:#000;font-weight:700;cursor:pointer;padding:8px 16px">Simpan</button><button data-reset style="' + css + 'cursor:pointer">Kembalikan default</button><button data-close style="' + css + 'cursor:pointer;margin-left:auto">Tutup</button></div></div>';
    ov.style.display = 'block';
  }
  const q = (root, k) => root.querySelector('[data-k="' + k + '"]');
  function save() {
    const g = k => q(ov, k).value, N = k => Number(g(k));
    const tiers = (id, ka) => [...ov.querySelectorAll('#' + id + ' .tr')].map(r => ({ [ka]: Number(q(r, 'a').value), pct: Number(q(r, 'b').value) })).filter(t => t[ka] >= 0 && t.pct >= 0 && !isNaN(t[ka]) && !isNaN(t.pct));
    const aliases = {}; ov.querySelectorAll('[data-alias]').forEach(s => { if (s.value) aliases[s.dataset.alias] = s.value; });
    const out = { markupPct: N('markupPct'), markupBelowStreak: N('markupBelowStreak'), streakTiers: tiers('st-streak', 'weeks'), gajiTiers: tiers('st-gaji', 'min'),
      voucher: { weeks: N('vWeeks'), amount: N('vAmount') }, gajiBatch: g('gajiBatch').trim() || 'auto', eligibility: g('eligibility'), aliases };
    if ([out.markupPct, out.markupBelowStreak, out.voucher.weeks, out.voucher.amount].some(isNaN) || out.voucher.weeks < 1) { alert('Ada angka yang tidak valid.'); return; }
    localStorage.setItem(KEY, JSON.stringify(out)); ov.style.display = 'none';
  }
  ov.addEventListener('click', e => { const t = e.target;

  window.OPJSettings = { open };
})();

document.getElementById('cfg').onclick=()=>OPJSettings.open();
</script>
