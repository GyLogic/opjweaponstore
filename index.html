    function renderSelfStatus(memberId) {
      const box = document.getElementById('selfStatus');
      const mem = members.find(m => m.id === memberId);
      if (!mem) {
        box.innerHTML = `<div class="text-xs text-gray-400">Pilih namamu untuk melihat status setoran minggu-minggu bulan ini.</div>`;
        return;
      }
      const paid = memberPaidMap(memberId);
      const cur = currentSlot();
      const chips = [];
      let weeksFull = 0;
      for (let w = 1; w <= WEEKS_PER_MONTH; w++) {
        const have = paid[slotKey({ m: cur.m, w })] || 0;
        if (isFull(have)) weeksFull++;
        let cls, label;
        if (isFull(have)) { cls = 'bg-emerald-950/50 text-emerald-300 border-emerald-700/50'; label = 'LUNAS'; }
        else if (have > EPS) { cls = 'bg-amber-950/40 text-amber-300 border-amber-800/40'; label = `CICIL (kurang ${100 - Math.floor(have * 100 + EPS)}%)`; }
        else if (w < cur.w) { cls = 'bg-rose-950/40 text-rose-400 border-rose-800/40'; label = 'BOLONG'; }
        else if (w === cur.w) { cls = 'bg-sky-950/40 text-sky-300 border-sky-800/40'; label = 'MINGGU INI'; }
        else { cls = 'bg-gray-900 text-gray-500 border-gang-border'; label = 'BELUM'; }
        chips.push(`
          <div class="rounded-lg border px-2 py-2 text-center ${cls} ${w === cur.w ? 'ring-2 ring-amber-500/60' : ''}">
            <div class="text-[10px] font-bold">W${w} <span class="font-normal opacity-70">${weekRangeText(cur.m, w)}</span></div>
            <div class="text-sm font-black">${pctText(have)}</div>
            <div class="text-[9px] font-bold leading-tight">${label}</div>
          </div>`);
      }
      box.innerHTML = `
        <div class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Status ${mem.nickname} - ${monthName(slotMonth(cur))}</div>
        <div class="grid grid-cols-${chips.length} gap-2">${chips.join('')}</div>
        <div class="text-xs mt-3 text-gray-300">Minggu lunas bulan ini: <span class="font-black ${weeksFull >= WEEKS_PER_MONTH ? 'text-emerald-400' : 'text-amber-400'}">${weeksFull}/${WEEKS_PER_MONTH}</span>${weeksFull >= WEEKS_PER_MONTH ? ' - kewajiban bulan ini LUNAS' : ' - kurang ' + (WEEKS_PER_MONTH - weeksFull) + ' minggu'}</div>
        <div class="text-[10px] text-gray-500 mt-1">Lunas per minggu = 100 MS <b>atau</b> 2 SM <b>atau</b> Rp30.000. Termasuk setoran yang masih menunggu konfirmasi admin.</div>`;
    }

    function refreshSelfPreview() {
      const box = document.getElementById('selfPreview');
      const memberId = document.getElementById('selfMember').value;
      renderSelfStatus(memberId);

      const method = selfMethod();
      const amount = parseInt(document.getElementById('selfAmount').value) || 0;
      const dir = document.querySelector('input[name="selfDir"]:checked').value;
      const head = '<div class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Rincian Pembagian Setoran</div>';

      if (!memberId) { box.innerHTML = head + '<div class="text-xs text-gray-400">Pilih nama dulu.</div>'; return; }
      if (amount <= 0) { box.innerHTML = head + '<div class="text-xs text-gray-400">Isi jumlah setoranmu, rincian per minggu akan muncul di sini.</div>'; return; }

      const r = allocateSubmission(memberId, method, amount, dir);
      const notes = [];
      if (dir === 'back' && r.fellBack) {
        notes.push('Tidak ada minggu sebelumnya (di bulan ini) yang bolong atau kurang, jadi setoran dihitung untuk <b>minggu ini dan seterusnya</b>.');
      } else if (dir === 'back' && r.backUsed > 0 && r.backUsed < amount) {
        notes.push(`Minggu yang bolong terisi ${amtOf(method, r.backUsed)}, sisa ${amtOf(method, amount - r.backUsed)} dihitung untuk <b>minggu ini dan seterusnya</b>.`);
      }
      const last = r.alloc[r.alloc.length - 1];
      if (last && !isFull(last.after)) {
        const rem = Math.ceil((1 - last.after) * UNIT[method] - EPS);
        notes.push(`${slotLabelOf(last)} masih <b>cicilan (${pctText(last.after)})</b>. Dianggap lunas setelah menambah ${amtOf(method, rem)} lagi (atau setara dari opsi lain).`);
      }

      const rows = r.alloc.map(a => {
        const rel = slotRelation({ m: parseInt(a.month), w: parseInt(a.week.slice(1)) });
        const relTxt = rel === 'past' ? 'minggu sebelumnya' : rel === 'now' ? 'minggu ini' : 'ke depan';
        const lunas = isFull(a.after);
        return `
          <tr>
            <td class="py-1.5 pr-2 font-bold text-white">${slotLabelOf(a)}<div class="text-[10px] text-gray-500 font-normal">${relTxt}</div></td>
            <td class="py-1.5 pr-2 text-right font-black">${amountBadges(a)}</td>
            <td class="py-1.5 text-right text-xs">
              <span class="px-1.5 py-0.5 rounded font-bold border ${lunas ? 'bg-emerald-950/50 text-emerald-300 border-emerald-700/50' : 'bg-amber-950/40 text-amber-300 border-amber-800/40'}">${lunas ? 'LUNAS' : 'CICIL ' + pctText(a.after)}</span>
            </td>
          </tr>`;
      }).join('');

      box.innerHTML = head + `
        <table class="w-full text-sm"><tbody class="divide-y divide-gang-border/60">${rows}</tbody></table>
        ${notes.map(n => `<div class="text-[11px] text-gray-300 bg-[#0b0f19] border border-gang-border rounded-lg px-3 py-2 mt-2">${n}</div>`).join('')}`;
    }

    function slotLabelOf(a) { return a.week + ' ' + monthName(a.month); }

    // ==================== SETOR MANDIRI: KOLOM NAMA DENGAN SARAN OTOMATIS ====================
    let selfListIdx = -1, selfListItems = [], selfListShowAll = false;

    function escHtml(v) {
      return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Cocokkan dengan nama (awalan paling atas), lalu paspor / discord
    function selfMemberMatches(q) {
      q = q.trim().toLowerCase();
      const byName = (a, b) => a.nickname.localeCompare(b.nickname, 'id', { sensitivity: 'base' });
      if (!q) return [...members].sort(byName);
      const score = m => {
        const n = m.nickname.toLowerCase();
        if (n.startsWith(q)) return 0;
        if (n.split(/[\s/]+/).some(w => w.startsWith(q))) return 1;
        if (n.includes(q)) return 2;
        if ((m.passport || '').toLowerCase().includes(q) || (m.discord || '').toLowerCase().includes(q)) return 3;
        return -1;
      };
      return members.map(m => ({ m, s: score(m) })).filter(x => x.s >= 0)
        .sort((a, b) => a.s - b.s || byName(a.m, b.m)).map(x => x.m);
    }

    function renderSelfMemberList() {
      const input = document.getElementById('selfMemberInput');
      const list = document.getElementById('selfMemberList');
      const q = selfListShowAll ? '' : input.value.trim();
      selfListItems = selfMemberMatches(q);
      if (selfListIdx >= selfListItems.length) selfListIdx = selfListItems.length - 1;
      if (!selfListItems.length) {
        list.innerHTML = '<div class="px-3.5 py-3 text-xs text-gray-500">Nama tidak ditemukan. Cek lagi ejaanmu.</div>';
        return;
      }
      const ql = q.toLowerCase();
      list.innerHTML = selfListItems.map((m, i) => {
        const n = m.nickname;
        const at = ql ? n.toLowerCase().indexOf(ql) : -1;
        const nameHtml = at >= 0
          ? escHtml(n.slice(0, at)) + '<span class="text-amber-400">' + escHtml(n.slice(at, at + ql.length)) + '</span>' + escHtml(n.slice(at + ql.length))
          : escHtml(n);
        return `<div data-id="${escHtml(m.id)}" class="px-3.5 py-2 cursor-pointer flex items-center justify-between gap-2 ${i === selfListIdx ? 'bg-amber-500/20' : 'hover:bg-gang-cardHover'}">
          <span class="font-bold text-white text-sm">${nameHtml}</span>
          <span class="text-[10px] text-gray-400 shrink-0">${escHtml(m.role)}</span>
        </div>`;
      }).join('');
      const act = list.children[selfListIdx];
      if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest' });
    }

    function openSelfMemberList() {
      const list = document.getElementById('selfMemberList');
      const wasOpen = !list.classList.contains('hidden');
      // Kalau nama sudah terpilih, klik kolom menampilkan seluruh daftar nama
      if (!wasOpen) { selfListShowAll = !!document.getElementById('selfMember').value; selfListIdx = -1; }
      list.classList.remove('hidden');
      renderSelfMemberList();
    }

    function closeSelfMemberList() {
      document.getElementById('selfMemberList').classList.add('hidden');
      selfListIdx = -1;
    }

    function toggleSelfMemberList() {
      const list = document.getElementById('selfMemberList');
      if (list.classList.contains('hidden')) {
        document.getElementById('selfMemberInput').focus();
        openSelfMemberList();
      } else {
        closeSelfMemberList();
      }
    }

    function pickSelfMember(id) {
      const mem = members.find(m => m.id === id);
      if (!mem) return;
      document.getElementById('selfMember').value = mem.id;
      document.getElementById('selfMemberInput').value = mem.nickname;
      document.getElementById('selfMemberHint').classList.add('hidden');
      closeSelfMemberList();
      refreshSelfPreview();
    }

    function onSelfMemberInput() {
      const input = document.getElementById('selfMemberInput');
      const hidden = document.getElementById('selfMember');
      selfListShowAll = false;
      selfListIdx = -1;
      hidden.value = '';
      document.getElementById('selfMemberHint').classList.add('hidden');
      const t = input.value.trim().toLowerCase();
      const exact = t ? members.filter(m => m.nickname.toLowerCase() === t) : [];
      if (exact.length === 1) hidden.value = exact[0].id;
      document.getElementById('selfMemberList').classList.remove('hidden');
      renderSelfMemberList();
      refreshSelfPreview();
    }

    function onSelfMemberKey(e) {
      const list = document.getElementById('selfMemberList');
      const open = !list.classList.contains('hidden');
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (!open) { openSelfMemberList(); return; }
        selfListIdx = Math.min(selfListIdx + 1, selfListItems.length - 1);
        renderSelfMemberList();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (!open) return;
        selfListIdx = Math.max(selfListIdx - 1, 0);
        renderSelfMemberList();
      } else if (e.key === 'Enter') {
        if (open && selfListItems.length) {
          e.preventDefault();
          pickSelfMember(selfListItems[selfListIdx >= 0 ? selfListIdx : 0].id);
        }
      } else if (e.key === 'Escape') {
        closeSelfMemberList();
      }
    }

    // Jika teks yang diketik persis satu nama anggota, otomatis dianggap terpilih
    function resolveSelfMember(showHint) {
      const input = document.getElementById('selfMemberInput');
      const hidden = document.getElementById('selfMember');
      const hint = document.getElementById('selfMemberHint');
      if (hidden.value) { hint.classList.add('hidden'); return true; }
      const t = input.value.trim().toLowerCase();
      if (!t) { hint.classList.add('hidden'); return false; }
      const exact = members.filter(m => m.nickname.toLowerCase() === t);
      if (exact.length === 1) {
        hidden.value = exact[0].id;
        input.value = exact[0].nickname;
        hint.classList.add('hidden');
        refreshSelfPreview();
        return true;
      }
      if (showHint) hint.classList.remove('hidden');
      return false;
    }

    function onSelfMemberBlur() {
      closeSelfMemberList();
      resolveSelfMember(true);
    }

    function syncSelfMemberField() {
      const hidden = document.getElementById('selfMember');
      const input = document.getElementById('selfMemberInput');
      if (hidden.value) {
        const mem = members.find(m => m.id === hidden.value);
        if (!mem) { hidden.value = ''; input.value = ''; }
        else if (document.activeElement !== input) input.value = mem.nickname;
      }
      if (!document.getElementById('selfMemberList').classList.contains('hidden')) renderSelfMemberList();
    }

    function initSelfMemberCombo() {
      const list = document.getElementById('selfMemberList');
      list.addEventListener('mousedown', e => {
        const it = e.target.closest('[data-id]');
        if (it) { e.preventDefault(); pickSelfMember(it.dataset.id); }
      });
      document.addEventListener('mousedown', e => {
        const box = document.getElementById('selfMemberBox');
        if (box && !box.contains(e.target)) closeSelfMemberList();
      });
    }

    function showSelfMsg(id, text) {
      ['selfError', 'selfSuccess'].forEach(x => document.getElementById(x).classList.add('hidden'));
      if (!id) return;
      const el = document.getElementById(id);
      el.textContent = text;
      el.classList.remove('hidden');
    }

    async function handleSelfSubmit(e) {
      e.preventDefault();
      showSelfMsg(null);
      resolveSelfMember(false);
      const memberId = document.getElementById('selfMember').value;
      const mem = members.find(m => m.id === memberId);
      const method = selfMethod();
      const amount = parseInt(document.getElementById('selfAmount').value) || 0;
      const receiver = cleanText(document.getElementById('selfReceiver').value, 60);
      const notes = cleanText(document.getElementById('selfNotes').value, 160);
      const dir = document.querySelector('input[name="selfDir"]:checked').value;

      if (!mem) return showSelfMsg('selfError', 'Pilih namamu dari daftar saran (ketik sebagian nama, lalu klik namamu).');
      if (amount <= 0) return showSelfMsg('selfError', 'Isi jumlah setoranmu, minimal 1.');
      if (amount > METHOD_META[method].max) return showSelfMsg('selfError', 'Jumlah terlalu besar. Hubungi admin untuk setoran sebesar ini.');
      if (!receiver) return showSelfMsg('selfError', 'Isi nama penerima setoran.');
      if (submissions.filter(x => x.memberId === memberId && x.status === 'pending').length >= 5) {
        return showSelfMsg('selfError', 'Masih ada 5 setoranmu yang menunggu konfirmasi admin. Tunggu dikonfirmasi dulu.');
      }

      const r = allocateSubmission(memberId, method, amount, dir);
      const sub = {
        id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        memberId, method,
        ms: method === 'MS' ? amount : 0,
        sm: method === 'SM' ? amount : 0,
        cash: method === 'CASH' ? amount : 0,
        direction: dir,
        allocation: r.alloc.map(a => ({ month: a.month, week: a.week, ms: a.ms, sm: a.sm, cash: a.cash })),
        receiver, notes,
        dateTime: nowLocalIso(),
        status: 'pending',
        fellBack: r.fellBack
      };

      const btn = document.getElementById('selfSubmitBtn');
      btn.disabled = true;
      try {
        await remoteSaveSubmission(sub);
      } catch (err) {
        btn.disabled = false;
        setRemoteState('error');
        return showSelfMsg('selfError', 'Gagal mengirim ke server. Periksa koneksi lalu coba lagi.');
      }
      btn.disabled = false;

      submissions.push(sub);
      saveLocalSubmissions();
      localStorage.setItem('opj_last_receiver', receiver);
      document.getElementById('selfNotes').value = '';
      onSelfMethodChange();   // isian jumlah kembali ke kewajiban 1 minggu
      showSelfMsg('selfSuccess', `Terkirim! Setoran ${amountText(sub)} atas nama ${mem.nickname} menunggu konfirmasi admin.`);
      renderApp();
    }

    function renderSubmissionQueue() {
      const tbody = document.getElementById('submissionTableBody');
      const pending = submissions.filter(x => x.status === 'pending').sort((a, b) => a.dateTime.localeCompare(b.dateTime));
      const done = submissions.filter(x => x.status !== 'pending').sort((a, b) => b.dateTime.localeCompare(a.dateTime)).slice(0, 20);
      const colspan = isAdmin ? 7 : 6;

      if (pending.length + done.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${colspan}" class="px-4 py-8 text-center text-gray-500 italic">Belum ada setoran mandiri.</td></tr>`;
        return;
      }

      const row = (x) => {
        const mem = members.find(m => m.id === x.memberId);
        const dt = new Date(x.dateTime);
        const dateStr = dt.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' });
        const timeStr = dt.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

        let before = {};
        if (x.status === 'pending') {
          before = memberPaidMap(x.memberId);
          x.allocation.forEach(a => { before[a.month + '-' + a.week] -= fracOf(a); });
        }
        const chips = x.allocation.map(a => {
          const label = `${a.week} ${monthName(a.month).slice(0, 3)} +${amountText(a)}`;
          if (x.status !== 'pending') {
            return `<span class="px-1.5 py-0.5 rounded bg-gray-800 text-gray-300 text-[10px] font-bold">${label}</span>`;
          }
          const after = (before[a.month + '-' + a.week] || 0) + fracOf(a);
          const ok = isFull(after);
          return `<span class="px-1.5 py-0.5 rounded border text-[10px] font-bold ${ok ? 'bg-emerald-950/50 text-emerald-300 border-emerald-700/50' : 'bg-amber-950/40 text-amber-300 border-amber-800/40'}">${label} ${ok ? 'lunas' : 'cicil ' + pctText(after)}</span>`;
        }).join(' ');

        const statusBadge = x.status === 'pending'
          ? '<span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30 text-[10px] font-bold">MENUNGGU</span>'
          : x.status === 'confirmed'
            ? '<span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-[10px] font-bold">DIKONFIRMASI</span>'
            : '<span class="px-2 py-0.5 rounded bg-rose-500/20 text-rose-300 border border-rose-500/30 text-[10px] font-bold">DITOLAK</span>';

        const actions = !isAdmin ? '' : `
          <td class="px-4 py-3 text-center">
            <div class="flex items-center justify-center gap-1">
              ${x.status === 'pending' ? `
                <button onclick="confirmSubmission('${x.id}')" class="px-2 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] font-bold">Konfirmasi</button>
                <button onclick="rejectSubmission('${x.id}')" class="px-2 py-1 rounded bg-rose-900/60 hover:bg-rose-800 text-rose-200 text-[10px] font-bold">Tolak</button>` : ''}
              <button onclick="deleteSubmission('${x.id}')" title="Hapus" class="px-2 py-1 rounded bg-red-950/40 hover:bg-red-900/60 text-rose-300 text-[10px] font-bold"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </td>`;

        return `
          <tr class="hover:bg-gang-cardHover/50 transition ${x.status === 'pending' ? '' : 'opacity-70'}">
            <td class="px-4 py-3 whitespace-nowrap"><div class="font-bold text-gray-200">${dateStr}</div><div class="text-[10px] text-gray-400">${timeStr}</div></td>
            <td class="px-4 py-3 font-bold text-white">${mem ? mem.nickname : '(anggota dihapus)'}</td>
            <td class="px-4 py-3 font-black">
              ${amountBadges(x)}
            </td>
            <td class="px-4 py-3"><div class="flex flex-wrap gap-1">${chips}</div>${x.fellBack ? '<div class="text-[10px] text-gray-500 mt-1">Minggu sebelumnya sudah lunas, dihitung ke depan.</div>' : ''}</td>
            <td class="px-4 py-3 text-gray-300">${x.receiver}${x.notes ? `<div class="text-[10px] text-gray-500 italic">"${x.notes}"</div>` : ''}</td>
            <td class="px-4 py-3">${statusBadge}</td>
            ${actions}
          </tr>`;
      };

      tbody.innerHTML = pending.map(row).join('') + done.map(row).join('');
    }

    // ==================== SETORAN MANDIRI: AKSI ADMIN ====================
    async function confirmSubmission(id) {
      if (!isAdmin) return;
      const x = submissions.find(s => s.id === id);
      if (!x || x.status !== 'pending') return;
      const mem = members.find(m => m.id === x.memberId);
      if (!mem) { alert('Anggota tidak ditemukan (mungkin sudah dihapus).'); return; }
      if (!confirm(`Konfirmasi bahwa ${mem.nickname} benar sudah menyetor ${amountText(x)} kepada ${x.receiver}?`)) return;

      x.status = 'confirmed';
      x.processedAt = nowLocalIso();
      try {
        await remoteSaveSubmission(x);
      } catch (err) {
        x.status = 'pending';
        x.processedAt = '';
        setRemoteState('error');
        alert('Gagal memperbarui status di server. Coba lagi.');
        return;
      }

      const stamp = Date.now();
      x.allocation.forEach((a, i) => {
        deposits.push({
          id: 'dep_' + stamp + '_' + i,
          memberId: x.memberId,
          ms: a.ms,
          sm: a.sm,
          cash: a.cash,
          month: a.month,
          week: a.week,
          dateTime: x.dateTime,
          receiver: x.receiver,
          notes: (x.notes ? x.notes + ' - ' : '') + 'Setoran mandiri',
          via: 'mandiri',
          submissionId: x.id
        });
      });
      saveLocalSubmissions();
      saveState();
      renderApp();
    }

    async function rejectSubmission(id) {
      if (!isAdmin) return;
      const x = submissions.find(s => s.id === id);
      if (!x || x.status !== 'pending') return;
      if (!confirm('Tolak setoran ini? (Setoran belum / tidak diterima)')) return;
      x.status = 'rejected';
      x.processedAt = nowLocalIso();
      try {
        await remoteSaveSubmission(x);
      } catch (err) {
        x.status = 'pending';
        x.processedAt = '';
        setRemoteState('error');
        alert('Gagal memperbarui status di server. Coba lagi.');
        return;
      }
      saveLocalSubmissions();
      renderApp();
    }

    async function deleteSubmission(id) {
      if (!isAdmin) return;
      if (!confirm('Hapus catatan setoran mandiri ini dari daftar? (Setoran yang sudah dikonfirmasi tetap ada di Riwayat)')) return;
      try {
        if (remoteOn()) await remoteReq('/submissions/' + id, 'DELETE');
      } catch (err) {
        setRemoteState('error');
        alert('Gagal menghapus di server. Coba lagi.');
        return;
      }
      submissions = submissions.filter(s => s.id !== id);
      saveLocalSubmissions();
      renderApp();
    }

    function exportCSV() {
      let csv = 'ID,Waktu,Penyetor,Paspor,Role,MS,SM,Uang (Rp),Bulan,Minggu,Penerima,Catatan\n';
      deposits.forEach(d => {
        const mem = members.find(m => m.id === d.memberId) || { nickname: 'N/A', passport: 'N/A', role: 'N/A' };
        csv += `"${d.id}","${d.dateTime}","${mem.nickname}","${mem.passport}","${mem.role}",${d.ms},${d.sm},${d.cash || 0},"${monthName(d.month)}","${d.week}","${d.receiver}","${d.notes || ''}"\n`;
      });

      csv += '\nPENYERAHAN\nID,Waktu,Kelompok Tujuan,Penerima,Diserahkan Oleh,MS,SM,Uang (Rp),Catatan\n';
      handovers.forEach(h => {
        csv += `"${h.id}","${h.dateTime}","${h.group}","${h.receiver || ''}","${h.giver || ''}",${h.ms},${h.sm},${h.cash || 0},"${h.notes || ''}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `OPJ_Setoran_Export_${monthName(activeMonth)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    window.addEventListener('DOMContentLoaded', init);
  <\/script>
</body>
</html></script>
<script type="text/plain" id="app-ws"><!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPJ Weapon Store</title>
  <!-- Logo di tab browser (favicon) -->
  <link rel="icon" type="image/png" href="image/opjlogo.png?v=1">
  <link rel="shortcut icon" type="image/png" href="image/opjlogo.png?v=1">
  <link rel="apple-touch-icon" href="image/opjlogo.png?v=1">
  <meta name="theme-color" content="#0b0f0c">  
  <!-- Tailwind CSS CDN -->
  <script>
/* BenefitEngine - fungsi murni (tanpa DOM). Dipakai browser (window.BenefitEngine) & tes Node. */
(function (root) {
  const DEFAULT_SETTINGS = {
    weekly: { ms: 100, sm: 2, cash: 30000 },
    eligibility: 'any',            // 'any' = setoran apa pun | 'ms' = wajib pernah setor Metal Scrap
    markupPct: 30,                 // kenaikan harga bila TIDAK rutin
    markupBelowStreak: 2,          // streak < nilai ini = tidak rutin
    streakTiers: [ {weeks:2,pct:3},{weeks:4,pct:5},{weeks:6,pct:10},{weeks:8,pct:15},{weeks:10,pct:20},{weeks:12,pct:25} ],
    voucher: { weeks: 16, amount: 200000 },
    gajiTiers: [ {min:200000,pct:10},{min:300000,pct:15},{min:450000,pct:20} ],
    gajiBatch: 'auto',             // 'auto' = batch selesai bernomor tertinggi, atau nama batch manual
    aliases: {}                    // { 'NAMA DI BARHAM': 'memberId' }
  };
  const num = v => Number(v) || 0;
  const weekOfDay = d => d <= 7 ? 1 : d <= 14 ? 2 : d <= 21 ? 3 : 4;
  const slotIndex = (y, m, w) => y * 48 + (m - 1) * 4 + (w - 1);
  const slotOfDate = dt => slotIndex(dt.getFullYear(), dt.getMonth() + 1, weekOfDay(dt.getDate()));
  function slotEnd(idx) {                     // akhir slot (ms epoch, waktu lokal)
    const y = Math.floor(idx / 48), r = idx % 48, m = Math.floor(r / 4) + 1, w = (r % 4) + 1;
    const lastDay = w === 4 ? new Date(y, m, 0).getDate() : w * 7;
    return new Date(y, m - 1, lastDay, 23, 59, 59, 999).getTime();
  }
  const fracOf = (o, wk) => num(o.ms) / wk.ms + num(o.sm) / wk.sm + num(o.cash) / wk.cash;

  /* Streak = jumlah minggu BERURUTAN yang lunas TEPAT WAKTU, dihitung mundur dari minggu sebelum minggu ini.
     Setoran yang baru diserahkan setelah minggu itu lewat (cicil susulan / borongan saat belanja) tidak dihitung. */
  function computeStreak(memberId, deposits, now, wk) {
    const cur = slotOfDate(now), paid = {};
    deposits.filter(d => String(d.memberId) === String(memberId)).forEach(d => {
      const t = new Date(d.dateTime); if (isNaN(t)) return;
      const m = parseInt(d.month, 10), w = parseInt(String(d.week).replace(/\D/g, ''), 10) || 1;
      const idx = slotIndex(t.getFullYear(), m, Math.min(4, w));
      if (idx >= cur) return;                         // hanya minggu-minggu sebelumnya
      if (t.getTime() > slotEnd(idx)) return;         // terlambat
      paid[idx] = (paid[idx] || 0) + fracOf(d, wk);
    });
    let s = 0;
    while (paid[cur - 1 - s] >= 1 - 1e-6) s++;
    return { streak: s, startSlot: cur - s };
  }

  function findBarhamName(member, aliases, name) {
    const n = String(name || '').trim().toLowerCase();
    if (!n) return false;
    for (const k in aliases) if (k.trim().toLowerCase() === n) return String(aliases[k]) === String(member.id);
    return n === String(member.nickname).trim().toLowerCase();
  }
  function pickBatch(barham, setting) {
    const b = (barham && barham.batches) || [];
    if (setting && setting !== 'auto') return String(setting);
    const done = b.filter(x => x.status === 'selesai').map(x => x.name).sort((a, c) => parseFloat(c) - parseFloat(a));
    return done[0] || null;
  }
  function computeGaji(member, barham, S) {
    const batch = pickBatch(barham, S.gajiBatch);
    if (!barham || !batch) return { batch, total: 0 };
    let total = 0;
    const add = (rows, nameKey, gajiKey) => (rows || []).forEach(r => {

    const LEGACY_NAME_MAP = {

    };
    function fixItemName(id, name) {
      const m = LEGACY_NAME_MAP[id];
      return (m && name === m.from) ? m.to : name;
    }

    // Ammo yang cocok per senjata (kunci = nama senjata huruf kecil, isi = ID ammo)
    const AMMO_COMPAT = {
      "machine pistol":     ["amo_9mm"],

      "micro smg":          ["amo_9mm"],

      "navy":               ["amo_magnum"],
      "revolver black":     ["amo_magnum"],
      "vektor kvr":         ["amo_45acp"]
    };

    // Keterangan "untuk senjata apa" pada setiap ammo
    const AMMO_USAGE = {
      amo_9mm:           "Machine Pistol, Mini SMG, Micro SMG",
      amo_sg:            "Pump Shotgun",
      amo_p50:           "Pistol 50",
      amo_rifle_ak:      "Virtus, AK",

    /* ---------------------------------------------------------------------
       KOREKSI DATA: Ammo Rifle AK <-> Ammo Rifle Carbine sebelumnya tertukar.
       Dijalankan di memori saat data dimuat (tidak menulis apa pun ke database).
       - Transaksi: hanya faktur yang dibuat SEBELUM AMMO_FIX_CUTOFF (waktunya dibaca dari ID faktur)

    const AMMO_CB_ID = "amo_rifle_carbine";

    const AMMO_FIXED_INITIAL = { [AMMO_AK_ID]: 0, [AMMO_CB_ID]: 80 }; // stok awal setelah ditukar
    const AMMO_FIX_CUTOFF = 1791450509696; // 08 Okt 2026 ~09:08 UTC; faktur setelah ini sudah memakai ammo yang benar

    function invoiceCreatedMs(tx) {
      const m = /^INV-([0-9A-Z]+)$/i.exec(String(tx.id || ""));
      if (!m) return 0; // ID tidak dikenal -> anggap data lama
      const ms = parseInt(m[1], 36);
      return isNaN(ms) ? 0 : ms;
    }

    function applyAmmoFix(col, arr) {
      if (col === "items") {
        arr.forEach(it => {
          if (it.id !== AMMO_AK_ID && it.id !== AMMO_CB_ID) return;
          if (!it.ammoFixed) {
            it.initialStock = AMMO_FIXED_INITIAL[it.id];
            it.ammoFixed = true;
          }
          if (it.id === AMMO_CB_ID && it.name === "Ammo Rifle .56mm carbine") it.name = AMMO_NAMES[AMMO_CB_ID];
        });
      } else if (col === "transactions") {
        arr.forEach(tx => {
          if (tx.ammoFixed) return;
          if (invoiceCreatedMs(tx) >= AMMO_FIX_CUTOFF) return; // faktur baru: sudah benar
          if (Array.isArray(tx.items)) {
            tx.items.forEach(line => {
              if (line.itemId === AMMO_AK_ID) { line.itemId = AMMO_CB_ID; line.itemName = AMMO_NAMES[AMMO_CB_ID]; }
              else if (line.itemId === AMMO_CB_ID) { line.itemId = AMMO_AK_ID; line.itemName = AMMO_NAMES[AMMO_AK_ID]; }
            });
          }
          tx.ammoFixed = true;

      attachPrompt: null // { weaponId, weaponName, qty } -> saran attachment setelah senjata ditambahkan
    };

    // Helper USD currency formatter
    function formatUSD(num) {
      return "$" + Number(num || 0).toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    // Helper datetime formatter
    function formatDateTimeLocal(isoString) {
      if (!isoString) return "-";
      const d = new Date(isoString);
      return d.toLocaleDateString("id-ID", {
        year: 'numeric',
        month: 'short',
        day: '2-digit'
      }) + " " + d.toLocaleTimeString("id-ID", { hour: '2-digit', minute: '2-digit' });
    }

    function isoToDatetimeLocalInput(isoString) {
      if (!isoString) return "";
      const d = new Date(isoString);
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 16);
    }

    /**
     * Hitung sisa stok gudang secara real-time.
     * ATURAN:
     * - Restock (IN) selalu menambah stok jika COMPLETED (atau bawaan backup).
     * - Penjualan (OUT) HANYA mengurangi stok bila status === 'COMPLETED' (Sudah Diberikan).
     * - Status 'PENDING' & 'PAID' TIDAK mengurangi stok gudang maupun valuasi aset.
     */
    function calculateStockSnapshot() {
      const stockMap = {};

      state.items.forEach(item => {
        stockMap[item.id] = {
          ...item,
          name: fixItemName(item.id, item.name),
          inQty: 0,
          outQty: 0,
          currentStock: item.initialStock || 0
        };
      });

      state.transactions.forEach(tx => {
        const isEffective = (tx.status === "COMPLETED") || (!tx.status); // Default file backup lama tanpa status dianggap COMPLETED

        if (Array.isArray(tx.items) && isEffective) {
          tx.items.forEach(line => {
            if (stockMap[line.itemId]) {
              if (tx.type === "IN") {
                stockMap[line.itemId].inQty += line.qty;
                stockMap[line.itemId].currentStock += line.qty;
              } else if (tx.type === "OUT") {
                stockMap[line.itemId].outQty += line.qty;
                stockMap[line.itemId].currentStock -= line.qty;
              }
            }
          });
        }
      });

      return stockMap;
    }

    /* =========================================================================
       PRE ORDER
       Dihitung otomatis dari faktur penjualan yang belum diserahkan (PENDING / PAID).
       Stok gudang dialokasikan ke faktur yang lebih dulu masuk; bagian yang tidak
       kebagian stok dihitung sebagai PRE ORDER. Tidak ada field tambahan di database,
       dan otomatis berkurang begitu ada restock.
       ========================================================================= */
    function computePreorderInfo() {
      const snapshot = calculateStockSnapshot();
      const remaining = {};
      Object.values(snapshot).forEach(i => { remaining[i.id] = Math.max(0, i.currentStock); });

      const outstanding = state.transactions
        .map((tx, idx) => ({ tx, idx }))
        .filter(o => o.tx.type === "OUT" && (o.tx.status === "PENDING" || o.tx.status === "PAID"))
        .sort((a, b) => {
          const ta = new Date(a.tx.timestamp).getTime() || 0;
          const tb = new Date(b.tx.timestamp).getTime() || 0;
          return (ta - tb) || (a.idx - b.idx);
        });

      const byInvoice = {};
      const byItem = {};
      let unitCount = 0;
      let value = 0;

      outstanding.forEach(({ tx }) => {
        const shortages = [];
        (tx.items || []).forEach(line => {
          const have = remaining[line.itemId] ?? 0;
          const alloc = Math.min(line.qty, have);
          remaining[line.itemId] = have - alloc;
          const short = line.qty - alloc;
          if (short > 0) {
            const nm = fixItemName(line.itemId, line.itemName);
            shortages.push({ itemId: line.itemId, itemName: nm, qty: line.qty, short });
            unitCount += short;
            value += short * (line.unitPrice || 0);
            if (!byItem[line.itemId]) byItem[line.itemId] = { itemId: line.itemId, name: nm, short: 0 };
            byItem[line.itemId].short += short;
          }
        });
        if (shortages.length) byInvoice[tx.id] = shortages;
      });

      return { remaining, byInvoice, byItem, orderCount: Object.keys(byInvoice).length, unitCount, value };
    }

    // Bagian keranjang saat ini yang akan menjadi Pre Order
    function getCartPreorderLines() {
      if (state.currentMode !== "OUT") return [];
      const pre = computePreorderInfo();
      const out = [];
      state.cart.forEach(line => {
        const free = pre.remaining[line.itemId] ?? 0;
        const short = line.qty - free;
        if (short > 0) out.push({ itemId: line.itemId, name: fixItemName(line.itemId, line.itemName), short });
      });
      return out;
    }

    function openAdminLoginModal() {
      if (state.isAdmin) {
        openModalDialog(
          "Keluar dari Sesi Admin?",
          "Anda akan kembali menjadi User Biasa dengan akses terbatas.",
          async () => {
            try {
              await window.FB.signOut(window.FB.auth);
              showFeedback("Berhasil keluar dari sesi Admin.", true);
            } catch (e) {
              showFeedback("Gagal logout: " + (e.message || e), false);
            }
          }
        );
      } else {
        document.getElementById("adminPasswordInput").value = "";
        document.getElementById("adminLoginError").classList.add("hidden");
        document.getElementById("adminLoginModal").classList.remove("hidden");
        setTimeout(() => document.getElementById("adminPasswordInput").focus(), 100);
      }
    }

    async function processAdminLogin() {
      const pwd = document.getElementById("adminPasswordInput").value;
      const err = document.getElementById("adminLoginError");
      const btn = document.getElementById("modalBtnSubmitLogin");

      if (!window.FB) {
        err.textContent = "Belum terhubung ke Firebase. Periksa koneksi / konfigurasi.";
        err.classList.remove("hidden");
        return;
      }
      if (!pwd) {
        err.textContent = "Password wajib diisi.";
        err.classList.remove("hidden");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Memeriksa...";
      try {
        await window.FB.signInWithEmailAndPassword(window.FB.auth, window.FB.ADMIN_EMAIL, pwd);
        document.getElementById("adminLoginModal").classList.add("hidden");
        showFeedback("Login Admin Berhasil! Selamat datang Administrator.", true);
      } catch (e) {
        const code = e && e.code ? e.code : "";
        if (code === "auth/network-request-failed") err.textContent = "Tidak ada koneksi internet.";
        else if (code === "auth/too-many-requests") err.textContent = "Terlalu banyak percobaan. Tunggu beberapa menit lalu coba lagi.";
        else err.textContent = "Password salah! Silakan coba lagi.";
        err.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.textContent = "Login Sekarang";
      }
    }

    /* =========================================================================
       SEARCHABLE COMBOBOX PICKER
       ========================================================================= */
    function setupCombobox() {
      const input = document.getElementById("comboboxInput");
      const dropdown = document.getElementById("comboboxDropdown");
      const btnToggle = document.getElementById("btnToggleDropdownList");

      function openDropdown(filter = "") {
        renderDropdownList(filter);
        dropdown.classList.remove("hidden");
      }

      function closeDropdown() {
        dropdown.classList.add("hidden");
      }

      input.addEventListener("focus", () => openDropdown(input.value.trim()));
      input.addEventListener("input", (e) => openDropdown(e.target.value.trim()));

      btnToggle.addEventListener("click", (e) => {
        e.stopPropagation();
        if (dropdown.classList.contains("hidden")) {
          input.focus();
          openDropdown(input.value.trim());
        } else {
          closeDropdown();
        }
      });

      document.addEventListener("click", (e) => {
        const wrapper = document.getElementById("comboboxWrapper");
        if (!wrapper.contains(e.target)) {
          closeDropdown();
        }
      });
    }

    function renderDropdownList(searchQuery = "") {
      const dropdown = document.getElementById("comboboxDropdown");
      dropdown.innerHTML = "";

      const snapshot = calculateStockSnapshot();
      let list = Object.values(snapshot);

      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        list = list.filter(item => 
          item.name.toLowerCase().includes(q) || 
          item.category.toLowerCase().includes(q)
        );
      }

      if (list.length === 0) {
        dropdown.innerHTML = `<div class="p-3 text-xs text-slate-500 text-center">Item tidak ditemukan</div>`;
        return;
      }

      const categories = [...new Set(list.map(i => i.category))];

      categories.forEach(cat => {
        const catHeader = document.createElement("div");
        catHeader.className = "px-3 py-1.5 bg-[#0f1611] text-[10px] font-mono font-bold text-slate-400 uppercase tracking-wider";
        catHeader.textContent = cat;
        dropdown.appendChild(catHeader);

        list.filter(i => i.category === cat).forEach(item => {
          const itemRow = document.createElement("div");
          itemRow.className = "px-3 py-2 text-xs flex items-center justify-between hover:bg-emerald-950/60 cursor-pointer transition";

          let stockBadge = "";
          if (item.currentStock <= 0) {
            stockBadge = `<span class="px-1.5 py-0.5 rounded text-[10px] bg-rose-950/80 text-rose-400 border border-rose-800/80 font-mono">HABIS (0)${state.currentMode === "OUT" ? " · PRE ORDER" : ""}</span>`;
          } else {
            stockBadge = `<span class="px-1.5 py-0.5 rounded text-[10px] bg-emerald-950/80 text-emerald-300 border border-emerald-800/80 font-mono">Stok: ${item.currentStock}</span>`;
          }

          itemRow.innerHTML = `
            <div class="flex items-center gap-2 flex-wrap">
              <span class="font-medium text-slate-200">${escapeHtml(item.name)}</span>
              ${ammoNote(item.id) ? `<span class="text-[10px] text-cyan-300/70">${escapeHtml(ammoNote(item.id))}</span>` : ""}
              ${item.tag ? `<span class="text-[9px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-1 rounded">${item.tag}</span>` : ""}
            </div>
            <div class="flex items-center gap-3">
              <span class="font-mono text-emerald-400 font-semibold">${formatUSD(item.price)}</span>
              ${stockBadge}
            </div>
          `;

          itemRow.addEventListener("click", () => {
            selectItemForCart(item);
            document.getElementById("comboboxDropdown").classList.add("hidden");
          });

          dropdown.appendChild(itemRow);
        });
      });
    }

    function selectItemForCart(item) {
      state.selectedItem = item;
      document.getElementById("comboboxInput").value = item.name;
      document.getElementById("pickerPrice").value = item.price;
      document.getElementById("pickerQty").value = 1;

      updatePickerStatus();
      document.getElementById("pickerQty").focus();
    }

    function updatePickerStatus() {
      const badge = document.getElementById("pickerStatusBadge");
      const text = document.getElementById("pickerStatusText");
      const num = document.getElementById("pickerStockNum");

      if (!state.selectedItem) {
        badge.classList.add("hidden");
        return;
      }

      const snapshot = calculateStockSnapshot();
      const current = snapshot[state.selectedItem.id] || state.selectedItem;

      const cartAllocated = state.cart
        .filter(c => c.itemId === current.id)
        .reduce((sum, c) => sum + c.qty, 0);

      const freeStock = computePreorderInfo().remaining[current.id] ?? 0;
      const availableForCart = freeStock - (state.currentMode === "OUT" ? cartAllocated : 0);

      badge.classList.remove("hidden");

      if (state.currentMode === "OUT") {
        if (availableForCart <= 0) {
          badge.className = "text-xs py-1.5 px-2.5 rounded-lg flex items-center justify-between bg-orange-950/70 text-orange-300 border border-orange-800";
          text.textContent = "Stok kosong / terpakai - tetap bisa dipesan sebagai PRE ORDER.";
          num.textContent = `Gudang: ${current.currentStock} Unit`;
        } else {
          badge.className = "text-xs py-1.5 px-2.5 rounded-lg flex items-center justify-between bg-emerald-950/70 text-emerald-300 border border-emerald-800";
          text.textContent = "Stok Tersedia (jumlah lebih dari ini = Pre Order):";
          num.textContent = `${availableForCart} Unit (Total Gudang: ${current.currentStock})`;
        }
      } else {
        badge.className = "text-xs py-1.5 px-2.5 rounded-lg flex items-center justify-between bg-blue-950/70 text-blue-300 border border-blue-800";
        text.textContent = "Stok Saat Ini (Akan ditambah):";
        num.textContent = `${current.currentStock} Unit`;
      }
    }

    function addItemToCart() {
      if (!state.selectedItem) {
        showFeedback("Pilih barang terlebih dahulu lewat kolom pencarian di atas!", false);
        return;
      }

      const qty = parseInt(document.getElementById("pickerQty").value, 10);
      const price = parseFloat(document.getElementById("pickerPrice").value);

      if (isNaN(qty) || qty <= 0) {
        showFeedback("Jumlah unit harus minimal 1!", false);
        return;
      }

      if (isNaN(price) || price < 0) {
        showFeedback("Harga tidak valid!", false);
        return;
      }

      const existingLine = state.cart.find(c => c.itemId === state.selectedItem.id);
      if (existingLine) {
        existingLine.qty += qty;
        existingLine.unitPrice = price;
        existingLine.subtotal = existingLine.qty * price;
      } else {
        state.cart.push({
          itemId: state.selectedItem.id,
          itemName: state.selectedItem.name,
          category: state.selectedItem.category,
          unitPrice: price,
          qty: qty,
          subtotal: qty * price
        });
      }

      const addedItem = state.selectedItem;
      state.selectedItem = null;
      document.getElementById("comboboxInput").value = "";
      document.getElementById("pickerQty").value = 1;
      document.getElementById("pickerPrice").value = "";
      updatePickerStatus();

      renderCart();
      validateCartStock();
      const poNow = getCartPreorderLines().find(x => x.itemId === addedItem.id);
      showFeedback(poNow
        ? `Item ditambahkan. Stok ${fixItemName(addedItem.id, addedItem.name)} kurang ${poNow.short} unit -> masuk PRE ORDER.`
        : "Item berhasil ditambahkan ke keranjang transaksi.", true);

      // Senjata terjual -> tawarkan attachment yang compatible
      if (state.currentMode === "OUT" && addedItem.category === "Senjata") {
        showAttachmentSuggestion(addedItem, qty);
      }
    }

    /* =========================================================================
       SARAN ATTACHMENT OTOMATIS
       ========================================================================= */
    function getCompatibleAttachments(weapon) {
      const snapshot = calculateStockSnapshot();
      const key = fixItemName(weapon.id, weapon.name).trim().toLowerCase();
      const ids = ATTACHMENT_COMPAT[key] || [];
      return ids.map(id => snapshot[id]).filter(Boolean);
    }

    function getCompatibleAmmo(weapon) {
      const snapshot = calculateStockSnapshot();
      const key = fixItemName(weapon.id, weapon.name).trim().toLowerCase();
      const ids = AMMO_COMPAT[key] || [];
      return ids.map(id => snapshot[id]).filter(Boolean);
    }

    // Stok bebas untuk item (setelah dikurangi order yang menunggu & isi keranjang)
    function attachAvailable(att) {
      const free = computePreorderInfo().remaining[att.id] ?? 0;
      const inCart = state.cart.filter(c => c.itemId === att.id).reduce((sum, c) => sum + c.qty, 0);
      return Math.max(0, free - inCart);
    }

    function hideAttachmentSuggestion() {
      state.attachPrompt = null;
      const panel = document.getElementById("attachSuggestPanel");
      if (panel) panel.classList.add("hidden");
    }

    function buildSuggestRow(item, qty) {
      const avail = attachAvailable(item);
      const note = ammoNote(item.id);
      const row = document.createElement("div");
      row.className = "flex items-center gap-2 px-2.5 py-1.5 rounded-lg border text-xs transition bg-[#18231c] " +
        (avail <= 0 ? "border-orange-800/60" : "border-emerald-900/60 hover:border-cyan-600/70");
      row.innerHTML = `
        <input type="checkbox" class="attach-check accent-cyan-500 shrink-0" data-id="${item.id}">
        <span class="flex-1 min-w-0">
          <span class="attach-name text-slate-200 font-medium cursor-pointer">${escapeHtml(item.name)}</span>
          ${note ? `<span class="block text-[10px] text-cyan-300/80">${escapeHtml(note)}</span>` : ""}
          <span class="attach-stock block text-[10px] font-mono"></span>
        </span>
        <span class="font-mono text-emerald-400 font-semibold whitespace-nowrap">${formatUSD(item.price)}</span>
        <input type="number" min="1" value="${qty}" data-id="${item.id}" title="Jumlah"
          class="attach-qty w-16 bg-black/30 border border-emerald-900/70 rounded px-1.5 py-1 text-xs font-mono text-center text-slate-100 focus:outline-none focus:border-cyan-500">
      `;
      const chk = row.querySelector(".attach-check");
      const qtyInput = row.querySelector(".attach-qty");
      const stockEl = row.querySelector(".attach-stock");

      const refresh = () => {
        const q = parseInt(qtyInput.value, 10);
        const want = isNaN(q) ? 0 : q;
        if (avail <= 0) {
          stockEl.className = "attach-stock block text-[10px] font-mono text-orange-300";
          stockEl.textContent = want > 0 ? `Stok kosong - ${want} unit masuk PRE ORDER` : "Stok kosong - masuk PRE ORDER";
        } else if (want > avail) {
          stockEl.className = "attach-stock block text-[10px] font-mono text-orange-300";
          stockEl.textContent = `Stok ${avail} - ${want - avail} unit masuk PRE ORDER`;
        } else {
          stockEl.className = "attach-stock block text-[10px] font-mono text-slate-500";
          stockEl.textContent = "Stok: " + avail;
        }
      };

      chk.addEventListener("change", () => {
        if (chk.checked && (!qtyInput.value || parseInt(qtyInput.value, 10) <= 0)) qtyInput.value = 1;
        refresh();
        updateAttachAddButton();
      });
      row.querySelector(".attach-name").addEventListener("click", () => {
        chk.checked = !chk.checked;
        chk.dispatchEvent(new Event("change"));
      });
      qtyInput.addEventListener("input", () => {
        const q = parseInt(qtyInput.value, 10);
        chk.checked = !isNaN(q) && q > 0;   // mengisi jumlah otomatis mencentang item
        refresh();
        updateAttachAddButton();
      });

      refresh();
      return row;
    }

    function showAttachmentSuggestion(weapon, qty) {
      const attList = getCompatibleAttachments(weapon);
      const ammoList = getCompatibleAmmo(weapon);
      if (attList.length === 0 && ammoList.length === 0) { hideAttachmentSuggestion(); return; }

      state.attachPrompt = { weaponId: weapon.id, weaponName: fixItemName(weapon.id, weapon.name), qty: qty };
      document.getElementById("attachSuggestWeapon").textContent = state.attachPrompt.weaponName;

      const box = document.getElementById("attachSuggestList");
      box.innerHTML = "";

      const addGroup = (title, list) => {
        if (list.length === 0) return;
        const h = document.createElement("div");
        h.className = "flex items-center justify-between text-[10px] font-bold text-slate-400 uppercase tracking-wider pt-1";
        h.innerHTML = `<span>${title}</span><span class="font-normal normal-case text-slate-500">Jumlah</span>`;
        box.appendChild(h);
        list.forEach(it => box.appendChild(buildSuggestRow(it, qty)));
      };
      addGroup("Attachment", attList);
      addGroup("Ammo - isi jumlah yang ingin dibeli", ammoList);

      updateAttachAddButton();
      document.getElementById("attachSuggestPanel").classList.remove("hidden");
    }

    function updateAttachAddButton() {
      const n = document.querySelectorAll("#attachSuggestList .attach-check:checked").length;
      const btn = document.getElementById("btnAttachAdd");
      btn.disabled = n === 0;
      btn.textContent = n === 0 ? "Pilih item atau isi jumlah di atas" : `Tambahkan ${n} Item ke Faktur`;
    }

    function addSelectedAttachments() {
      const snapshot = calculateStockSnapshot();
      const checks = document.querySelectorAll("#attachSuggestList .attach-check:checked");
      let added = 0;
      let poItems = 0;
      const errors = [];

      checks.forEach(chk => {
        const id = chk.getAttribute("data-id");
        const att = snapshot[id];
        const qtyInput = document.querySelector(`#attachSuggestList .attach-qty[data-id="${id}"]`);
        const q = parseInt(qtyInput.value, 10);
        if (!att || isNaN(q) || q <= 0) { errors.push(`${att ? att.name : id}: jumlah tidak valid`); return; }

        if (q > attachAvailable(att)) poItems++;

        const existing = state.cart.find(c => c.itemId === id);
        if (existing) {
          existing.qty += q;
          existing.subtotal = existing.qty * existing.unitPrice;
        } else {
          state.cart.push({
            itemId: id,
            itemName: att.name,
            category: att.category,
            unitPrice: att.price,
            qty: q,
            subtotal: q * att.price
          });
        }
        added++;
      });

      if (errors.length) {
        showFeedback("Sebagian tidak ditambahkan -> " + errors.join("; "), false);
        if (added === 0) return;
      } else {
        showFeedback(`${added} item (attachment/ammo) ditambahkan ke faktur.` + (poItems ? ` ${poItems} item stok kurang/kosong -> masuk PRE ORDER.` : ""), true);
      }

      hideAttachmentSuggestion();
      renderCart();
      validateCartStock();
      updatePickerStatus();
    }

    function removeCartItem(index) {
      state.cart.splice(index, 1);
      renderCart();
      validateCartStock();
      updatePickerStatus();
    }

    function renderCart() {
      const tbody = document.getElementById("cartTableBody");
      const empty = document.getElementById("cartEmptyState");
      const countBadge = document.getElementById("cartCountBadge");
      const summaryText = document.getElementById("cartItemsSummaryText");
      const grandTotalElem = document.getElementById("cartGrandTotal");

      tbody.innerHTML = "";
      countBadge.textContent = `${state.cart.length} Item`;

      if (state.attachPrompt && (state.currentMode !== "OUT" || !state.cart.some(c => c.itemId === state.attachPrompt.weaponId))) {
        hideAttachmentSuggestion();
      }

      if (state.cart.length === 0) {
        empty.classList.remove("hidden");
        summaryText.textContent = "0 item dalam pesanan";
        grandTotalElem.textContent = "$0.00";
        validateCartStock();
        return;
      }

      empty.classList.add("hidden");

      let totalQty = 0;
      let grandTotal = 0;
      const snapshot = calculateStockSnapshot();
      const preInfo = computePreorderInfo();
      let poUnits = 0;

      state.cart.forEach((line, index) => {
        totalQty += line.qty;
        grandTotal += line.subtotal;

        const currentStock = snapshot[line.itemId]?.currentStock ?? 0;
        const poShort = state.currentMode === "OUT" ? Math.max(0, line.qty - (preInfo.remaining[line.itemId] ?? 0)) : 0;
        const isExceeded = poShort > 0;
        poUnits += poShort;
        const noteTxt = ammoNote(line.itemId);

        const tr = document.createElement("tr");
        tr.className = `border-b border-emerald-950/50 hover:bg-black/30 text-slate-300 transition ${isExceeded ? 'bg-orange-950/30' : ''}`;

        tr.innerHTML = `
          <td class="py-2 px-2.5">
            <div class="font-medium text-slate-200 text-xs">${escapeHtml(fixItemName(line.itemId, line.itemName))}</div>
            ${noteTxt ? `<div class="text-[10px] text-cyan-300/70">${escapeHtml(noteTxt)}</div>` : ""}
            <div class="text-[10px] text-slate-500 font-mono">Stok Gudang: ${currentStock} Unit
              ${isExceeded ? `<span class="ml-1 px-1.5 py-0.5 rounded text-[9px] font-bold bg-orange-500/15 text-orange-300 border border-orange-500/40">PRE ORDER ${poShort} unit</span>` : ""}
            </div>
          </td>
          <td class="py-2 px-1.5 text-right font-mono text-xs">${formatUSD(line.unitPrice)}</td>
          <td class="py-2 px-1.5 text-center font-mono font-bold ${isExceeded ? 'text-orange-300' : 'text-slate-100'}">${line.qty}</td>
          <td class="py-2 px-2 text-right font-mono font-semibold text-emerald-400 text-xs">${formatUSD(line.subtotal)}</td>
          <td class="py-2 px-1.5 text-center">
            <button type="button" onclick="removeCartItem(${index})" class="text-slate-500 hover:text-rose-400 p-1 rounded transition">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      summaryText.textContent = `${totalQty} unit total dalam faktur ini` + (poUnits > 0 ? ` · ${poUnits} unit Pre Order` : "");
      grandTotalElem.textContent = window.OPJBenefit ? window.OPJBenefit.display(grandTotal) : formatUSD(grandTotal);
      validateCartStock();
    }

    function validateCartStock() {
      const submitBtn = document.getElementById("btnSubmitOrder");
      const alertBox = document.getElementById("strictStockAlert");
      const alertTitle = document.getElementById("strictStockAlertTitle");
      const alertDesc = document.getElementById("strictStockAlertDesc");
      const submitLabel = document.getElementById("btnSubmitOrderLabel");

      if (state.cart.length === 0) {
        submitBtn.disabled = true;
        submitBtn.className = "w-full py-3 px-4 bg-slate-800 text-slate-500 text-xs font-bold uppercase tracking-wider rounded-xl transition flex items-center justify-center gap-2 cursor-not-allowed";
        alertBox.classList.add("hidden");
        return false;
      }

      const poLines = getCartPreorderLines();

      if (poLines.length > 0) {
        alertBox.className = "p-3 rounded-lg bg-orange-950/70 border border-orange-700/70 text-orange-200 text-xs flex items-start gap-2 shadow-lg";
        alertTitle.textContent = "Termasuk PRE ORDER";
        alertDesc.textContent = `Stok kosong / kurang pada: ${poLines.map(x => `${x.name} (kurang ${x.short})`).join(", ")}. Order tetap bisa diproses - bagian yang kurang dihitung sebagai Pre Order dan baru bisa diserahkan setelah ada restock.`;
      } else {
        alertBox.classList.add("hidden");
      }

      submitBtn.disabled = false;
      if (state.currentMode === "OUT") {
        submitBtn.className = "w-full py-3 px-4 bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white text-xs font-bold uppercase tracking-wider rounded-xl shadow-lg hover:shadow-rose-950/50 transition flex items-center justify-center gap-2 cursor-pointer";
        if (submitLabel) submitLabel.textContent = poLines.length > 0 ? "Proses Transaksi (Termasuk Pre Order)" : "Proses Transaksi Penjualan";
      } else {
        submitBtn.className = "w-full py-3 px-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-bold uppercase tracking-wider rounded-xl shadow-lg hover:shadow-emerald-950/50 transition flex items-center justify-center gap-2 cursor-pointer";
        if (submitLabel) submitLabel.textContent = "Proses Transaksi Restock";
      }
      return true;
    }

    /**
     * Saat user menginput transaksi:
     * - Jika OUT (Penjualan), status otomatis di-set ke "PENDING" (Menunggu Bayar).
     *   Stok dan Valuasi BELUM berubah sampai admin memverifikasi.
     * - Jika IN (Restock oleh admin), otomatis langsung COMPLETED.
     */
    function processOrderTransaction() {
      if (!validateCartStock()) return;

      const dtInput = document.getElementById("txDateTime").value;
      const customerInput = document.getElementById("txCustomer").value.trim();

      const timestamp = dtInput ? new Date(dtInput).toISOString() : new Date().toISOString();
      const grandTotal = state.cart.reduce((sum, c) => sum + c.subtotal, 0);
      const totalUnits = state.cart.reduce((sum, c) => sum + c.qty, 0);
      if (window.OPJBenefit && !window.OPJBenefit.guard()) return;

      // Status inisial: OUT -> PENDING (Menunggu Pembayaran), IN -> COMPLETED
      const initialStatus = (state.currentMode === "OUT") ? "PENDING" : "COMPLETED";

      const poLinesForMsg = getCartPreorderLines();

      const invoice = {
        id: "INV-" + Date.now().toString(36).toUpperCase(),
        timestamp: timestamp,
        type: state.currentMode,
        status: initialStatus,
        customer: customerInput || (state.currentMode === "OUT" ? "Customer Umum" : "Restock Gudang"),
        items: JSON.parse(JSON.stringify(state.cart)),
        totalUnits: totalUnits,
        grandTotal: grandTotal
      };
      const __bn = window.OPJBenefit ? window.OPJBenefit.apply(state.cart, grandTotal) : null;
      if (__bn) { invoice.items = __bn.items; invoice.grandTotal = __bn.total; invoice.memberId = __bn.memberId; invoice.benefit = __bn.benefit; }

      state.transactions.push(invoice);
      if (window.OPJBenefit) window.OPJBenefit.afterSubmit(invoice);
      saveToCloud();

      state.cart = [];
      document.getElementById("txCustomer").value = "";
      setCurrentDatetimeInput();

      renderAllViews();
      renderCart();
      updatePickerStatus();

      if (invoice.type === "OUT") {
        showFeedback(`Order ${invoice.id} berhasil diajukan ke log! Menunggu verifikasi Admin (Stok belum terpotong).` +
          (poLinesForMsg.length ? ` PRE ORDER: ${poLinesForMsg.map(x => `${x.name} ×${x.short}`).join(", ")}.` : ""), true);
      } else {
        showFeedback(`Restock ${invoice.id} berhasil dicatat & stok bertambah.`, true);
      }
    }

    function switchTransactionMode(mode) {
      const btnToggleOut = document.getElementById("btnToggleOut");
      const btnToggleIn = document.getElementById("btnToggleIn");
      const txIndicator = document.getElementById("txTypeIndicator");
      const txHeaderTitle = document.getElementById("txHeaderTitle");
      const lblCust = document.getElementById("lblCustomerName");
      const submitLabel = document.getElementById("btnSubmitOrderLabel");

      if (mode === "IN" && !state.isAdmin) {
        showFeedback("Hanya Administrator yang berhak mencatat barang masuk / restock!", false);
        return;
      }

      state.currentMode = mode;
      hideAttachmentSuggestion();

      if (mode === "OUT") {
        btnToggleOut.className = "px-3 py-1.5 rounded-md font-semibold bg-rose-600 text-white shadow transition";
        btnToggleIn.className = "px-3 py-1.5 rounded-md font-semibold text-slate-400 hover:text-white transition" + (!state.isAdmin ? " hidden" : "");
        txIndicator.className = "w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse";
        txHeaderTitle.textContent = "Pencatatan Penjualan (Barang Keluar)";
        lblCust.textContent = "Nama Pembeli / Regu";
        submitLabel.textContent = "Proses Transaksi Penjualan";
      } else {
        btnToggleIn.className = "px-3 py-1.5 rounded-md font-semibold bg-emerald-600 text-white shadow transition";
        btnToggleOut.className = "px-3 py-1.5 rounded-md font-semibold text-slate-400 hover:text-white transition";
        txIndicator.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
        txHeaderTitle.textContent = "Pencatatan Restock (Barang Masuk)";
        lblCust.textContent = "Pemasok / Sumber Barang";
        submitLabel.textContent = "Proses Transaksi Restock";
      }

      updatePickerStatus();
      renderCart();
    }

    /* =========================================================================
       VERIFIKASI BERTAHAP OLEH ADMIN (SUDAH BAYAR -> SUDAH DIBERIKAN)
       ========================================================================= */
    window.verifyPayment = function(invoiceId) {
      if (!state.isAdmin) {
        showFeedback("Akses ditolak! Hanya admin yang bisa memverifikasi pembayaran.", false);
        return;
      }

      const tx = state.transactions.find(t => t.id === invoiceId);
      if (!tx) return;

      tx.status = "PAID";
      saveToCloud();
      renderAllViews();
      showFeedback(`Faktur ${tx.id}: Pembayaran terverifikasi! Tombol "Sudah Diberikan" kini aktif. (Stok belum berkurang).`, true);
    };

    window.verifyDelivered = function(invoiceId) {
      if (!state.isAdmin) {
        showFeedback("Akses ditolak! Hanya admin yang bisa memverifikasi serah terima barang.", false);
        return;
      }

      const tx = state.transactions.find(t => t.id === invoiceId);
      if (!tx) return;

      // Cek apakah stok fisik masih mencukupi sebelum resmi dipotong
      const snapshot = calculateStockSnapshot();
      const lackingItems = [];
      tx.items.forEach(line => {
        const avail = snapshot[line.itemId]?.currentStock ?? 0;
        if (line.qty > avail) {
          lackingItems.push(`${line.itemName} (Butuh ${line.qty}, Sisa ${avail})`);
        }
      });

      if (lackingItems.length > 0) {
        showFeedback(`Belum bisa diserahkan (Pre Order - tunggu restock). Stok gudang saat ini tidak cukup: ${lackingItems.join(", ")}`, false);
        return;
      }

      openModalDialog(
        "Konfirmasi Serah Terima Barang?",
        `Barang pada faktur ${tx.id} akan resmi diserahkan. Stok gudang akan otomatis dipotong, valuasi aset disesuaikan, dan pendapatan penjualan tercatat resmi.`,
        () => {
          tx.status = "COMPLETED";
          saveToCloud();
          renderAllViews();
          validateCartStock();
          updatePickerStatus();
          showFeedback(`Faktur ${tx.id}: Barang berhasil diserahkan! Stok gudang & valuasi aset telah diperbarui secara resmi.`, true);
        }
      );
    };

    /* =========================================================================
       RENDER VIEWS & DATA TABLES
       ========================================================================= */
    function renderAllViews() {
      const snapshot = calculateStockSnapshot();
      const inventoryList = Object.values(snapshot);

      let totalStockUnits = 0;
      let totalAssetValuation = 0;
      let totalInUnits = 0;
      let totalInVal = 0;
      let totalDeliveredUnits = 0;
      let totalRevenueDeliveredVal = 0;

      inventoryList.forEach(item => {
        totalStockUnits += item.currentStock;
        totalAssetValuation += (item.currentStock * item.price);
        totalInUnits += item.inQty;
      });

      // Akumulasi pendapatan dan unit keluar HANYA dari transaksi yang sudah COMPLETED (Sudah Diberikan)
      state.transactions.forEach(tx => {
        const isDelivered = (tx.status === "COMPLETED") || (!tx.status); // Transaksi backup lama dianggap selesai[cite: 2]
        
        if (tx.type === "IN" && isDelivered) {
          totalInVal += (tx.grandTotal || 0);
        } else if (tx.type === "OUT" && isDelivered) {
          totalDeliveredUnits += (tx.totalUnits || 0);
          totalRevenueDeliveredVal += (tx.grandTotal || 0);
        }
      });

      // Update KPI
      document.getElementById("cardTotalValuation").textContent = formatUSD(totalAssetValuation);
      document.getElementById("cardTotalUnits").textContent = `${totalStockUnits.toLocaleString("en-US")} Unit`;
      document.getElementById("cardItemTypesCount").textContent = `${inventoryList.length} tipe barang aktif`;

      document.getElementById("cardTotalInflow").textContent = `+${totalInUnits} Unit`;
      document.getElementById("cardTotalInflowVal").textContent = `Restock: ${formatUSD(totalInVal)}`;

      // Card Nominal Pendapatan Penjualan
      document.getElementById("cardSalesMini").textContent = `Total penjualan: ${formatUSD(totalRevenueDeliveredVal)}`;
      document.getElementById("cardTotalOutflow").textContent = `${totalDeliveredUnits.toLocaleString("en-US")} Unit Telah Diserahkan`;

      // Pre Order
      const pre = computePreorderInfo();
      document.getElementById("cardPreorderUnits").textContent = `${pre.unitCount.toLocaleString("en-US")} Unit`;
      document.getElementById("cardPreorderSub").textContent = `${pre.orderCount} order menunggu stok · ${formatUSD(pre.value)}`;
      const topItems = Object.values(pre.byItem).sort((a, b) => b.short - a.short);
      document.getElementById("cardPreorderItems").textContent = topItems.length === 0
        ? "Tidak ada pre order"
        : topItems.slice(0, 3).map(x => `${x.name} ×${x.short}`).join(", ") + (topItems.length > 3 ? ` +${topItems.length - 3} lainnya` : "");

      renderInventoryTable(inventoryList);
      renderTransactionHistory();
      renderCashPanel();
      updateDbBanner();
    }

    /* =========================================================================
       URUTAN KATALOG PERSEDIAAN
       ========================================================================= */
    const CATEGORY_ORDER = ["Senjata", "Attachment", "Vest", "Ammo"];
    const NUMERIC_SORT_KEYS = ["initialStock", "inQty", "outQty", "currentStock", "price", "total"];

    function categoryRank(cat) {
      const i = CATEGORY_ORDER.indexOf(cat);
      return i === -1 ? CATEGORY_ORDER.length : i;
    }

    function sortValue(item, key) {
      if (key === "total") return item.currentStock * item.price;
      return item[key];
    }

    function sortInventoryList(list) {
      const arr = [...list];
      const byName = (a, b) => a.name.localeCompare(b.name, "id", { numeric: true });

      // Urutan bawaan: Senjata -> Attachment -> Vest -> Ammo.
      // Di dalam tiap kategori: yang ready stock di atas (terbanyak dulu), yang kosong di bawah kategorinya sendiri.
      if (!state.sortKey) {
        return arr.sort((a, b) => {
          const c = categoryRank(a.category) - categoryRank(b.category);
          if (c !== 0) return c;
          const aReady = a.currentStock > 0 ? 0 : 1;
          const bReady = b.currentStock > 0 ? 0 : 1;
          if (aReady !== bReady) return aReady - bReady;
          if (a.currentStock !== b.currentStock) return b.currentStock - a.currentStock;
          return byName(a, b);
        });
      }

      const dir = state.sortDir === "asc" ? 1 : -1;
      const key = state.sortKey;
      return arr.sort((a, b) => {
        let r;
        if (key === "name") r = byName(a, b);
        else if (key === "category") r = categoryRank(a.category) - categoryRank(b.category);
        else r = sortValue(a, key) - sortValue(b, key);
        if (r !== 0) return r * dir;
        return byName(a, b); // tie-breaker
      });
    }

    // Klik 1: arah awal (angka = terbanyak dulu, teks = A-Z), klik 2: dibalik, klik 3: kembali ke urutan bawaan
    function handleSortClick(key) {
      const firstDir = NUMERIC_SORT_KEYS.includes(key) ? "desc" : "asc";
      const oppositeDir = firstDir === "desc" ? "asc" : "desc";
      if (state.sortKey !== key) {
        state.sortKey = key;
        state.sortDir = firstDir;
      } else if (state.sortDir === firstDir) {
        state.sortDir = oppositeDir;
      } else {
        state.sortKey = null;
        state.sortDir = "desc";
      }
      renderInventoryTable(Object.values(calculateStockSnapshot()));
    }

    function updateSortIndicators() {
      document.querySelectorAll(".sortable-th").forEach(th => {
        const arrow = th.querySelector(".sort-arrow");
        const active = state.sortKey === th.getAttribute("data-sort");
        arrow.innerHTML = active ? (state.sortDir === "asc" ? "&#9650;" : "&#9660;") : "&#8693;";
        arrow.classList.toggle("opacity-40", !active);
        arrow.classList.toggle("opacity-100", active);
        th.classList.toggle("text-emerald-300", active && th.getAttribute("data-sort") !== "currentStock");
      });
    }

    function renderInventoryTable(items) {
      const tbody = document.getElementById("inventoryStockBody");
      tbody.innerHTML = "";

      let list = items;

      if (state.filterCategory !== "ALL") {
        list = list.filter(i => i.category === state.filterCategory);
      }

      if (state.filterSearch.trim() !== "") {
        const q = state.filterSearch.toLowerCase();
        list = list.filter(i => i.name.toLowerCase().includes(q) || i.category.toLowerCase().includes(q));
      }

      list = sortInventoryList(list);
      updateSortIndicators();

      document.getElementById("stockTableCountText").textContent = `${list.length} Item`;

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-6 text-slate-500">Tidak ada barang yang cocok.</td></tr>`;
        return;
      }

      list.forEach(item => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-emerald-950/20 transition border-b border-emerald-950/50 text-slate-300";

        let stockBadge = "";
        if (item.currentStock <= 0) {
          stockBadge = `<span class="ml-1.5 px-1.5 py-0.5 rounded text-[9px] bg-rose-950 text-rose-400 border border-rose-800 font-mono">HABIS</span>`;
        } else if (item.currentStock <= 3) {
          stockBadge = `<span class="ml-1.5 px-1.5 py-0.5 rounded text-[9px] bg-amber-950 text-amber-300 border border-amber-800 font-mono">MENIPIS</span>`;
        }

        const tagBadge = item.tag ? `<span class="ml-1.5 px-1.5 py-0.2 rounded text-[9px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">${item.tag}</span>` : "";
        const itemValuation = item.currentStock * item.price;

        tr.innerHTML = `
          <td class="py-2.5 px-3 font-medium text-slate-200">
            <span class="cursor-pointer hover:text-emerald-400 font-semibold" onclick="quickSelectFromTable('${item.id}')">${escapeHtml(item.name)}</span>
            ${tagBadge}
            ${stockBadge}
            ${ammoNote(item.id) ? `<div class="text-[10px] text-cyan-300/70 font-normal mt-0.5">${escapeHtml(ammoNote(item.id))}</div>` : ""}
          </td>
          <td class="py-2.5 px-2 text-slate-400 font-mono text-[11px]">${item.category}</td>
          <td class="py-2.5 px-2 text-right font-mono text-slate-400">${item.initialStock}</td>
          <td class="py-2.5 px-2 text-right font-mono text-emerald-400/90">${item.inQty > 0 ? '+' + item.inQty : '0'}</td>
          <td class="py-2.5 px-2 text-right font-mono text-rose-400/90">${item.outQty > 0 ? '-' + item.outQty : '0'}</td>
          <td class="py-2.5 px-2 text-right font-mono font-bold ${item.currentStock > 0 ? 'text-emerald-300' : 'text-rose-400'}">${item.currentStock}</td>
          <td class="py-2.5 px-3 text-right font-mono text-slate-300">${formatUSD(item.price)}</td>
          <td class="py-2.5 px-3 text-right font-mono font-bold text-slate-100">${formatUSD(itemValuation)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderTransactionHistory() {

        empty.classList.remove("hidden");

              <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
              MENUNGGU PEMBAYARAN

        } else if (status === "PAID") {

              <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
              SUDAH BAYAR
            </span>
            <div class="text-[9px] text-cyan-400/70 mt-0.5">Menunggu Diserahkan</div>
          `;

          statusBadgeHtml = `
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 font-mono">
              <svg class="w-3 h-3 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>

            <div class="text-[9px] text-orange-300/80 mt-0.5 max-w-[160px] mx-auto whitespace-normal">Menunggu restock: ${poShort.map(x => `${escapeHtml(x.itemName)} ×${x.short}`).join(", ")}</div>

        // Action Column: Tombol Verifikasi & Edit

                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                </button>
                <button onclick="deleteTransactionInvoice('${tx.id}')" class="p-1 hover:text-rose-400 text-slate-500 hover:bg-rose-950/50 rounded transition" title="Hapus Mutasi Ini">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
